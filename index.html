/* ============================================================
   CHAT RESPONSE ENGINE
   ============================================================ */

function generateChatResponse(
  raw
){

  const text=
    raw.toLowerCase();


  const profile=
    getProfile();

  const plan=
    getPlan();

  const progress=
    getProgress();

  const meals=
    getMeals();


  if(
    !profile ||
    !plan
  ){

    return(
      "Complete your FITFORM profile first. I need your goal and training context before giving personalized guidance."
    );

  }


  const first=
    profile.name
      .split(" ")[0];


  if(
    text.includes("protein")
  ){

    return`

      ${first}, your current FITFORM
      starting target is about
      ${plan.protein} g protein/day.

      Spread that across your
      ${profile.meals} preferred meals
      using protein-rich foods that fit
      your ${pretty(profile.diet)} diet.

    `;

  }


  if(
    text.includes("today") &&
    (
      text.includes("workout")||
      text.includes("training")
    )
  ){

    const workout=
      plan.workouts[0];


    return`

      Today's suggested session is
      ${workout.name}.

      It has
      ${workout.exercises.length}
      exercises.

      Start with
      ${workout.exercises[0].name}
      and follow the session order.

      Progression:
      ${plan.progression.rule}

    `;

  }


  if(
    text.includes("eat")||
    text.includes("meal")||
    text.includes("food")
  ){

    const today=
      meals[
        todayKey()
      ]||[];


    const eaten=
      today.reduce(
        (sum,item)=>
          sum+
          Number(
            item.calories||0
          ),
        0
      );


    const nextIndex=
      plan.meals.findIndex(
        (meal,index)=>
          !today.some(
            item=>
              item.planIndex===index
          )
      );


    if(nextIndex>=0){

      const meal=
        plan.meals[nextIndex];


      return`

        Your next planned meal is
        ${meal.name}.

        Approximate target:
        ${meal.calories} kcal and
        ${meal.protein} g protein.

        Suggested food pool:
        ${meal.foods.join(", ")}.

        You've logged around
        ${eaten} kcal today.

      `;

    }


    return(
      "You've logged all planned meals for today. Focus on hunger, fullness, hydration and overall food quality rather than forcing extra food simply to satisfy an app number."
    );

  }


  if(
    text.includes("missed") &&
    text.includes("workout")
  ){

    return(
      "Missing one workout is not a disaster. Don't punish yourself with a double session. Move the missed workout to the next realistic training day and resume the normal schedule."
    );

  }


  if(
    text.includes("not progressing")||
    text.includes("not making progress")||
    text.includes("stuck")
  ){

    return`

      Check the basics first:

      1. Are you completing the planned sessions?
      2. Are you getting close to ${plan.protein} g protein?
      3. Is nutrition reasonably consistent?
      4. Are reps or loads progressing?
      5. Is recovery adequate?

      If those are consistent for several weeks
      and the trend remains flat, reassess the plan
      rather than changing everything every few days.

    `;

  }


  if(
    text.includes("home workout")||
    text.includes("at home")
  ){

    return`

      For your ${pretty(
        profile.equipment
      )} setup, a practical home session can use
      push-ups, pike push-ups, squats, split squats,
      hip hinges, rows with available equipment and
      a core movement.

      Use controlled reps and leave roughly
      1–3 good reps in reserve instead of chasing
      exhaustion.

    `;

  }


  if(
    text.includes("calorie")||
    text.includes("calories")
  ){

    return`

      Your current estimated starting target is
      ${plan.calories} kcal/day.

      Estimated maintenance is around
      ${plan.tdee} kcal/day.

      These are estimates, not laboratory measurements.
      Actual requirements change with activity,
      body composition and real-world adherence.

    `;

  }


  if(
    text.includes("sleep")||
    text.includes("recovery")
  ){

    return`

      Your profile reports
      ${pretty(profile.sleep)} sleep.

      Prioritize a consistent sleep schedule,
      sensible training volume and recovery between
      hard sessions.

      If recovery is poor, simply adding more training
      usually isn't the clever solution.

    `;

  }


  if(
    text.includes("step")||
    text.includes("walking")
  ){

    return`

      Your FITFORM step target is
      ${plan.steps.toLocaleString()} per day.

      Build toward it gradually rather than treating
      the number as a pass/fail exam.

    `;

  }


  if(
    text.includes("progression")||
    text.includes("progressive overload")||
    text.includes("stronger")
  ){

    return(
      plan.progression.rule
    );

  }


  if(
    text.includes("goal")||
    text.includes("plan")
  ){

    return`

      Your current goal is
      ${goalLabel(profile.goal)}
      using a
      ${pretty(profile.approach)}
      approach.

      Current starting estimates:

      Calories:
      ${plan.calories} kcal

      Protein:
      ${plan.protein} g

      Steps:
      ${plan.steps.toLocaleString()}

      Training:
      ${profile.trainingDays} days/week

    `;

  }


  return`

    Based on your profile, keep the focus on:

    ${goalLabel(profile.goal)}

    ${plan.protein} g protein/day

    ${plan.steps.toLocaleString()} daily steps

    ${profile.trainingDays} training days/week

    and adequate recovery.

    Ask me about a specific workout,
    meal, exercise or progress issue
    for a more targeted answer.

  `;

}


/* ============================================================
   ANIMATED NUMBERS
   ------------------------------------------------------------
   Guarded to prevent duplicate RAF loops.
   ============================================================ */

function animateNumbers(){

  const elements=
    document.querySelectorAll(
      "[data-count]"
    );


  elements.forEach(
    element=>{

      const target=
        Number(
          element.dataset.count
        );


      if(
        !Number.isFinite(
          target
        )
      ){

        return;

      }


      /*
        Small numbers don't need a long animation.
      */

      const duration=
        target>1000
          ?550
          :400;


      const start=
        performance.now();


      function frame(now){

        const progress=
          clamp(
            (
              now-start
            )/
            duration,
            0,
            1
          );


        const eased=
          1-
          Math.pow(
            1-progress,
            3
          );


        element.textContent=
          Math.round(
            target*eased
          ).toLocaleString();


        if(
          progress<1
        ){

          requestAnimationFrame(
            frame
          );

        }

      }


      requestAnimationFrame(
        frame
      );

    }
  );

}


/* ============================================================
   RINGS
   ============================================================ */

function animateRings(){

  document
    .querySelectorAll(
      ".ring-progress"
    )
    .forEach(
      ring=>{

        const percent=
          clamp(
            Number(
              ring.dataset.progress
            )||0,
            0,
            100
          );


        const circumference=
          301.59;


        /*
          Force initial state.
          Then move to target on next frame.
        */

        ring.style.strokeDashoffset=
          circumference;


        requestAnimationFrame(()=>{

          ring.style.strokeDashoffset=
            circumference-
            (
              circumference*
              percent/
              100
            );

        });

      }
    );

}


/* ============================================================
   RETURN TO APP
   ============================================================ */

function returnToApp(page){

  state.currentWorkout=null;

  stopTimer();

  state.activePage=
    page;


  renderApp();


  requestAnimationFrame(()=>{

    window.scrollTo(
      {
        top:0,
        behavior:"auto"
      }
    );

  });

}


/* ============================================================
   MAIN APP EVENT DELEGATION
   ------------------------------------------------------------
   This is another important performance improvement.
   Instead of attaching dozens of listeners to every page
   element, the page container gets one delegated listener.
   ============================================================ */

document.addEventListener(
  "click",
  event=>{

    const startWorkoutButton=
      event.target.closest(
        "[data-start-workout]"
      );


    if(
      startWorkoutButton &&
      state.screen==="app"
    ){

      startWorkout(
        startWorkoutButton.dataset.startWorkout
      );

      return;

    }


    const mealButton=
      event.target.closest(
        "[data-meal-index]"
      );


    if(
      mealButton &&
      state.activePage==="nutrition"
    ){

      toggleMeal(
        Number(
          mealButton.dataset.mealIndex
        )
      );

      return;

    }


    const stepsButton=
      event.target.closest(
        "#updateStepsButton"
      );


    if(stepsButton){

      openStepsModal();

      return;

    }


    const weightButton=
      event.target.closest(
        "#saveWeightButton"
      );


    if(weightButton){

      logWeight();

      return;

    }


    const checkinButton=
      event.target.closest(
        "#progressCheckinButton"
      );


    if(checkinButton){

      openCheckin();

      return;

    }


    const rebuild=
      event.target.closest(
        "#rebuildPlanButton"
      );


    if(rebuild){

      rebuildPlan();

      return;

    }


    const edit=
      event.target.closest(
        "#editProfileButton"
      );


    if(edit){

      editProfile();

      return;

    }


    const logoutButton=
      event.target.closest(
        "#logoutButton"
      );


    if(logoutButton){

      logout();

      return;

    }

  }
);


/* ============================================================
   GLOBAL ESCAPE KEY
   ============================================================ */

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Escape"
    ){

      closeModal();

      closeChat();

    }

  }
);


/* ============================================================
   PAGE VISIBILITY
   ------------------------------------------------------------
   Timer continues correctly without trying to rerender.
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  ()=>{

    /*
      No page rerender here.
      This intentionally does nothing.
      Browser tab visibility should not cause
      the UI to jump when the user returns.
    */

  }
);


/* ============================================================
   BEFORE UNLOAD
   ============================================================ */

window.addEventListener(
  "beforeunload",
  ()=>{

    stopTimer();

    clearTimeout(
      onboardingSaveTimer
    );

  }
);


/* ============================================================
   INITIAL BOOT
   ============================================================ */

function boot(){

  /*
    Give the splash enough time to establish brand,
    but keep it short so startup doesn't feel sluggish.
  */

  setTimeout(()=>{

    const splash=
      document.getElementById(
        "splash"
      );


    if(splash){

      splash.classList.add(
        "is-hidden"
      );

    }


    const session=
      getSession();


    if(!session){

      renderAuth();

      return;

    }


    enterApp();

  },520);

}


/* ============================================================
   START FITFORM
   ============================================================ */

boot();

</script>
