<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FITFORM</title>

<style>
/* =========================================================
   FITFORM
   Single-file personalized fitness application
   No external dependencies
   ========================================================= */

:root{
  --bg:#07090d;
  --bg2:#0b0e14;
  --panel:#10141b;
  --panel2:#151a22;
  --panel3:#1b2029;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --text:#f5f7fa;
  --muted:#8d96a5;
  --muted2:#667080;
  --accent:#c8ff38;
  --accent2:#9ee900;
  --danger:#ff5f6d;
  --warning:#ffca55;
  --success:#62e6a5;
  --info:#70a7ff;
  --radius:22px;
  --radius-sm:15px;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
  color-scheme:dark;
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 80% -10%,rgba(200,255,56,.08),transparent 28%),
    radial-gradient(circle at -10% 35%,rgba(112,167,255,.05),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   APP SHELL
   ========================================================= */

#app{
  min-height:100vh;
}

.screen{
  min-height:100vh;
  animation:screenIn .32s ease both;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================================================
   SPLASH
   ========================================================= */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07090d;
  transition:opacity .5s ease,visibility .5s ease;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
}

.splash-logo{
  text-align:center;
  animation:splashFloat 1.3s ease both;
}

@keyframes splashFloat{
  0%{
    opacity:0;
    transform:scale(.85) translateY(20px);
  }
  60%{
    opacity:1;
    transform:scale(1.03);
  }
  100%{
    transform:scale(1);
  }
}

.logo-mark{
  width:74px;
  height:74px;
  margin:auto;
  border:2px solid var(--accent);
  border-radius:24px;
  display:grid;
  place-items:center;
  position:relative;
  transform:rotate(-8deg);
  box-shadow:
    0 0 0 8px rgba(200,255,56,.04),
    0 0 45px rgba(200,255,56,.14);
}

.logo-mark:before,
.logo-mark:after{
  content:"";
  position:absolute;
  width:30px;
  height:4px;
  background:var(--accent);
  border-radius:10px;
}

.logo-mark:before{
  transform:rotate(45deg);
}

.logo-mark:after{
  transform:rotate(-45deg);
}

.logo-mark span{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  position:relative;
  z-index:2;
}

.brand{
  font-weight:950;
  letter-spacing:.16em;
}

.splash-logo .brand{
  font-size:26px;
  margin-top:20px;
}

.splash-sub{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-top:8px;
}

/* =========================================================
   AUTH
   ========================================================= */

.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:rgba(16,20,27,.9);
  border:1px solid var(--line);
  border-radius:30px;
  padding:28px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  animation:cardIn .45s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(22px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.auth-logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:35px;
}

.auth-logo .logo-mark{
  width:46px;
  height:46px;
  border-radius:15px;
}

.auth-logo .logo-mark:before,
.auth-logo .logo-mark:after{
  width:20px;
  height:3px;
}

.auth-logo .brand{
  font-size:19px;
}

.auth-title{
  font-size:34px;
  line-height:1.02;
  margin:0 0 10px;
  font-weight:900;
  letter-spacing:-.04em;
}

.auth-sub{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 25px;
  font-size:14px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:5px;
  background:#080a0e;
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:22px;
}

.auth-tab{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:10px;
  font-weight:800;
  font-size:12px;
}

.auth-tab.active{
  background:var(--panel2);
  color:var(--text);
}

.auth-form{
  display:grid;
  gap:14px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  color:#c4cbd5;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--line2);
  background:#0a0d12;
  color:var(--text);
  border-radius:14px;
  padding:14px;
  outline:none;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:rgba(200,255,56,.65);
  box-shadow:0 0 0 4px rgba(200,255,56,.07);
}

.password-row{
  position:relative;
}

.password-row input{
  padding-right:55px;
}

.eye-btn{
  position:absolute;
  right:8px;
  top:7px;
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  color:var(--muted);
  background:transparent;
}

.primary-btn,
.secondary-btn,
.danger-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px 18px;
  font-weight:900;
  letter-spacing:.01em;
  transition:transform .14s ease,filter .2s,box-shadow .2s;
}

.primary-btn{
  background:var(--accent);
  color:#101400;
  box-shadow:0 10px 30px rgba(200,255,56,.12);
}

.primary-btn:hover{
  filter:brightness(1.04);
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active{
  transform:scale(.97);
}

.secondary-btn{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
}

.danger-btn{
  background:rgba(255,95,109,.1);
  color:#ff929c;
  border:1px solid rgba(255,95,109,.18);
}

.auth-links{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:16px;
}

.text-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:4px 0;
  font-size:12px;
}

.text-btn:hover{
  color:var(--text);
}

.demo-note{
  margin-top:18px;
  padding:12px;
  border-radius:13px;
  background:rgba(255,202,85,.05);
  border:1px solid rgba(255,202,85,.12);
  color:#b5a87e;
  font-size:10px;
  line-height:1.5;
}

/* =========================================================
   ONBOARDING
   ========================================================= */

.onboard{
  max-width:620px;
  margin:auto;
  padding:20px 20px 40px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.onboard-top{
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(var(--bg) 75%,transparent);
  padding:5px 0 22px;
}

.onboard-brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.mini-brand{
  font-size:13px;
  font-weight:950;
  letter-spacing:.17em;
}

.progress-meta{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.progress-track{
  height:5px;
  border-radius:20px;
  background:#171b21;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  border-radius:inherit;
  background:var(--accent);
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}

.question{
  flex:1;
  padding-top:25px;
  animation:questionIn .3s ease both;
}

@keyframes questionIn{
  from{
    opacity:0;
    transform:translateX(20px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.question-kicker{
  color:var(--accent);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-weight:900;
  margin-bottom:12px;
}

.question h1{
  font-size:clamp(31px,8vw,50px);
  line-height:.98;
  letter-spacing:-.045em;
  margin:0 0 12px;
  font-weight:950;
}

.question p{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 25px;
  font-size:14px;
}

.choice-grid{
  display:grid;
  gap:10px;
}

.choice{
  padding:17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  color:var(--text);
  text-align:left;
  transition:all .18s ease;
  position:relative;
  overflow:hidden;
}

.choice:hover{
  border-color:var(--line2);
}

.choice:active{
  transform:scale(.985);
}

.choice.selected{
  border-color:rgba(200,255,56,.65);
  background:rgba(200,255,56,.07);
}

.choice.selected:after{
  content:"✓";
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--accent);
  font-weight:950;
}

.choice-title{
  font-weight:850;
  font-size:14px;
}

.choice-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  line-height:1.4;
}

.unit-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.number-field{
  position:relative;
}

.number-field input{
  padding-right:60px;
}

.number-field span{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.onboard-bottom{
  display:flex;
  gap:10px;
  padding-top:25px;
}

.onboard-bottom button{
  min-height:52px;
}

.back-btn{
  width:52px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:15px;
  font-weight:900;
}

.next-btn{
  flex:1;
}

/* =========================================================
   MAIN APP
   ========================================================= */

.app-shell{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 18px 15px;
  background:rgba(7,9,13,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.035);
}

.topbar-brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar-mark{
  width:32px;
  height:32px;
  border:1px solid var(--accent);
  border-radius:10px;
  position:relative;
  transform:rotate(-7deg);
}

.topbar-mark:before,
.topbar-mark:after{
  content:"";
  position:absolute;
  left:6px;
  right:6px;
  height:3px;
  top:14px;
  border-radius:5px;
  background:var(--accent);
}

.topbar-mark:before{
  transform:rotate(45deg);
}

.topbar-mark:after{
  transform:rotate(-45deg);
}

.topbar-title{
  font-weight:950;
  font-size:13px;
  letter-spacing:.14em;
}

.topbar-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  display:grid;
  place-items:center;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--accent);
  color:#101400;
  display:grid;
  place-items:center;
  font-weight:950;
}

.page{
  padding:22px 18px 0;
  animation:pageIn .32s ease both;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.greeting{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.greeting-kicker{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:800;
}

.greeting h1{
  margin:4px 0 0;
  font-size:31px;
  letter-spacing:-.04em;
  line-height:1;
}

.date-text{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
  background:linear-gradient(145deg,rgba(20,25,33,.98),rgba(12,15,21,.98));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}

.card + .card{
  margin-top:12px;
}

.card-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.card-title{
  font-size:14px;
  font-weight:900;
  letter-spacing:-.01em;
}

.card-link{
  border:0;
  background:transparent;
  color:var(--accent);
  font-size:10px;
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.08em;
}

.hero-card{
  background:
    radial-gradient(circle at 100% 0%,rgba(200,255,56,.14),transparent 35%),
    linear-gradient(145deg,#151b20,#0e1218);
  border:1px solid rgba(200,255,56,.13);
  overflow:hidden;
  position:relative;
}

.hero-label{
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.hero-card h2{
  margin:8px 0;
  font-size:27px;
  line-height:1.05;
  letter-spacing:-.04em;
}

.hero-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  max-width:500px;
}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}

.hero-stat{
  background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.06);
  padding:11px;
  border-radius:14px;
}

.hero-stat strong{
  display:block;
  font-size:17px;
  margin-bottom:4px;
}

.hero-stat span{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:800;
}

.stat-value{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.04em;
  margin-top:6px;
}

.stat-unit{
  color:var(--muted);
  font-size:10px;
}

/* =========================================================
   RINGS
   ========================================================= */

.ring-wrap{
  position:relative;
  width:112px;
  height:112px;
  flex:none;
}

.ring{
  width:112px;
  height:112px;
  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;
  stroke:#20252d;
  stroke-width:8;
}

.ring-progress{
  fill:none;
  stroke:var(--accent);
  stroke-width:8;
  stroke-linecap:round;
  stroke-dasharray:301.59;
  stroke-dashoffset:301.59;
  transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);
}

.ring-center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
}

.ring-number{
  font-size:24px;
  font-weight:950;
  line-height:1;
}

.ring-label{
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-top:4px;
}

.ring-card{
  display:flex;
  align-items:center;
  gap:18px;
}

.ring-info h3{
  margin:0 0 5px;
  font-size:18px;
}

.ring-info p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* =========================================================
   WORKOUT
   ========================================================= */

.section-heading{
  margin:25px 0 12px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.13em;
  color:var(--muted);
  font-weight:900;
}

.exercise-list{
  display:grid;
  gap:9px;
}

.exercise{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  transition:.2s;
}

.exercise.done{
  opacity:.58;
  border-color:rgba(98,230,165,.25);
}

.exercise.done .exercise-check{
  background:var(--success);
  color:#07120c;
  border-color:var(--success);
}

.exercise-check{
  width:35px;
  height:35px;
  flex:none;
  border-radius:11px;
  border:1px solid var(--line2);
  background:#0a0d12;
  color:transparent;
  display:grid;
  place-items:center;
  font-weight:950;
  transition:.2s;
}

.exercise-main{
  min-width:0;
  flex:1;
}

.exercise-name{
  font-size:13px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.exercise-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.exercise-action{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

/* =========================================================
   TIMER
   ========================================================= */

.timer-card{
  text-align:center;
  padding:25px 18px;
}

.timer-label{
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.14em;
  font-weight:900;
}

.timer-value{
  font-size:60px;
  font-weight:950;
  letter-spacing:-.06em;
  margin:5px 0 18px;
  font-variant-numeric:tabular-nums;
}

.timer-controls{
  display:flex;
  justify-content:center;
  gap:8px;
}

.timer-controls button{
  width:48px;
  height:48px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-weight:900;
}

.timer-controls .timer-main{
  background:var(--accent);
  color:#111500;
  border-color:var(--accent);
}

/* =========================================================
   NUTRITION
   ========================================================= */

.macro-row{
  display:grid;
  gap:13px;
}

.macro{
  display:grid;
  gap:7px;
}

.macro-top{
  display:flex;
  justify-content:space-between;
  font-size:11px;
}

.macro-top span:first-child{
  font-weight:800;
}

.macro-top span:last-child{
  color:var(--muted);
}

.macro-track{
  height:7px;
  background:#20242b;
  border-radius:10px;
  overflow:hidden;
}

.macro-fill{
  height:100%;
  width:0;
  background:var(--accent);
  border-radius:inherit;
  transition:width .8s ease;
}

.meal-list{
  display:grid;
  gap:8px;
}

.meal{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:13px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:15px;
}

.meal-info strong{
  font-size:12px;
}

.meal-info p{
  color:var(--muted);

}

.meal-cal{
  font-size:11px;

}

/* =========================================================
   PROGRESS
   ========================================================= */

.chart{
  height:170px;
  position:relative;
  overflow:hidden;
  border-radius:15px;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:100% 25%;
}

.chart svg{
  width:100%;
  height:100%;
}

.chart-empty{
  height:100%;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:11px;
  text-align:center;
  padding:30px;
}

.history{
  display:grid;
  gap:8px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:13px;
  background:var(--panel);
  border:1px solid var(--line);
}

.history-item strong{
  font-size:12px;
}

.history-item span{
  color:var(--muted);
  font-size:10px;
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-head{
  display:flex;
  gap:15px;
  align-items:center;
  margin-bottom:20px;
}

.profile-avatar{
  width:64px;
  height:64px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:#101400;
  font-size:22px;
  font-weight:950;
}

.profile-head h2{
  margin:0 0 5px;
  font-size:22px;
}

.profile-head p{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.profile-item{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}

.profile-item small{
  display:block;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.profile-item strong{
  display:block;
  margin-top:5px;
  font-size:12px;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(100%,700px);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(8,10,14,.92);
  backdrop-filter:blur(22px);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:20px 20px 0 0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  position:relative;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px 7px;
  border-radius:13px;
  font-size:9px;
  font-weight:800;
  transition:.2s;
}

.nav-icon{
  display:block;
  font-size:18px;
  line-height:1;
  margin-bottom:5px;
  transition:.2s;
}

.nav-btn.active{
  color:var(--accent);
}

.nav-btn.active .nav-icon{
  transform:translateY(-2px);
}

/* =========================================================
   CHATBOT
   ========================================================= */

.chat-fab{
  position:fixed;
  z-index:90;
  right:17px;
  bottom:92px;
  width:54px;
  height:54px;
  border:1px solid rgba(200,255,56,.25);
  background:var(--accent);
  color:#111500;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(0,0,0,.3);
  font-size:20px;
  font-weight:950;
  transition:.2s;
}

.chat-fab:active{
  transform:scale(.92);
}

.chat-panel{
  position:fixed;
  z-index:200;
  inset:0;
  background:#07090d;
  display:flex;
  flex-direction:column;
  animation:chatIn .3s ease both;
}

@keyframes chatIn{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.chat-header{
  padding:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(7,9,13,.92);
}

.chat-brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-brand-mark{
  width:36px;
  height:36px;
  border-radius:12px;
  background:var(--accent);
  color:#101400;
  display:grid;
  place-items:center;
  font-weight:950;
}

.chat-brand strong{
  display:block;
  font-size:13px;
}

.chat-brand span{
  display:block;
  color:var(--success);
  font-size:9px;
  margin-top:3px;
}

.chat-close{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:18px 16px 20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:86%;
  padding:12px 14px;
  border-radius:16px;
  font-size:12px;
  line-height:1.55;
  animation:messageIn .25s ease both;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.bot{
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--line);
  border-top-left-radius:5px;
}

.message.user{
  align-self:flex-end;
  background:var(--accent);
  color:#101400;
  border-top-right-radius:5px;
  font-weight:650;
}

.typing{
  display:flex;
  gap:4px;
  align-items:center;
}

.typing i{
  width:5px;
  height:5px;
  background:var(--muted);
  border-radius:50%;
  animation:typing .9s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,100%{opacity:.25;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-3px)}
}

.chat-suggestions{
  padding:10px 15px 4px;
  display:flex;
  gap:7px;
  overflow:auto;
}

.suggestion{
  flex:none;
  border:1px solid var(--line);
  background:var(--panel);
  color:#cfd5dd;
  border-radius:100px;
  padding:8px 11px;
  font-size:10px;
  white-space:nowrap;
}

.chat-input{
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  display:flex;
  gap:8px;
  background:#0a0d12;
}

.chat-input input{
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  outline:none;
  border-radius:15px;
  padding:12px;
}

.chat-send{
  width:45px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#111500;
  font-weight:950;
}

/* =========================================================
   MODALS
   ========================================================= */

.modal-layer{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.68);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  backdrop-filter:blur(8px);
  animation:fadeIn .2s ease both;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.modal{
  width:min(100%,550px);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line2);
  border-radius:25px;
  padding:20px;
  animation:modalUp .28s ease both;
}

@keyframes modalUp{
  from{
    opacity:0;
    transform:translateY(35px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:18px;
}

.modal-close{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:94px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#eaf6d0;
  color:#111600;
  padding:11px 15px;
  border-radius:13px;
  font-size:11px;
  font-weight:850;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
  transition:.25s ease;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   SKELETON
   ========================================================= */

.skeleton{
  background:
    linear-gradient(
      90deg,
      #11151b 25%,
      #1b2028 37%,
      #11151b 63%
    );
  background-size:400% 100%;
  animation:skeleton 1.3s infinite;
  border-radius:12px;
}

@keyframes skeleton{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

.loading-card{
  height:160px;
}

/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--line);
  border-radius:100px;
  padding:5px 8px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}

.badge.accent{
  border-color:rgba(200,255,56,.2);
  background:rgba(200,255,56,.06);
  color:var(--accent);
}

.badge.success{

  border-color:rgba(98,230,165,.18);
}

/* =========================================================
   CHECK-IN
   ========================================================= */

.checkin-grid{
  display:grid;
  gap:10px;
}

.scale-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);

}

.scale-btn{
  height:42px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel2);
  color:var(--muted);

}

  border-color:var(--accent);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(min-width:700px){
  .page{
    padding-left:28px;
    padding-right:28px;
  }

  .dashboard-grid{
    display:grid;

    align-items:start;
  }

  .dashboard-grid .card + .card{
    margin-top:0;
  }

  .stats-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bottom-nav{
    bottom:15px;
    border:1px solid var(--line);
    border-radius:20px;
  }

  .chat-fab{
    bottom:88px;
  }
}

@media(min-width:950px){
  .app-shell{
    padding-bottom:100px;
  }

  .page{
    padding-top:30px;
  }
}

/* =========================================================
   ACCESSIBILITY
   ========================================================= */

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

::selection{
  background:var(--accent);
  color:#111500;
}
</style>
</head>

<body>

<div id="splash">
  <div class="splash-logo">
    <div class="logo-mark"><span></span></div>
    <div class="brand">FITFORM</div>
    <div class="splash-sub">PERSONALIZED FITNESS SYSTEM</div>
  </div>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   FITFORM APPLICATION ENGINE
   ========================================================= */

"use strict";

/* =========================================================
   STORAGE KEYS
   ========================================================= */

const KEYS = {
  accounts: "fitform_accounts_v3",
  session: "fitform_session_v3",
  profile: "fitform_profile_v3",
  plan: "fitform_plan_v3",
  progress: "fitform_progress_v3",
  meals: "fitform_meals_v3",
  chat: "fitform_chat_v3",
  onboarding: "fitform_onboarding_v3"
};

/* =========================================================
   GLOBAL STATE
   ========================================================= */

let state = {
  screen: "loading",
  authMode: "login",
  onboardingStep: 0,
  onboardingData: {},
  activePage: "home",
  timer: 0,
  timerRunning: false,
  timerInterval: null,
  currentWorkout: null,
  modal: null
};

/* =========================================================
   STORAGE HELPERS
   ========================================================= */

function read(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function write(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function remove(key){
  localStorage.removeItem(key);
}

function getAccounts(){
  return read(KEYS.accounts,[]);
}

function currentSession(){
  return read(KEYS.session,null);
}

function currentProfile(){
  return read(KEYS.profile,null);
}

function currentPlan(){
  return read(KEYS.plan,null);
}

function currentProgress(){
  return read(KEYS.progress,{
    weights:[],
    workouts:[],
    checkins:[],
    currentStreak:0,
    bestStreak:0
  });
}

function currentMeals(){
  return read(KEYS.meals,{});
}

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function todayKey(){
  return new Date().toISOString().slice(0,10);
}

function formatDate(date){
  return new Intl.DateTimeFormat("en-IN",{
    day:"numeric",
    month:"short",
    year:"numeric"
  }).format(date);
}

function shortDate(date){
  return new Intl.DateTimeFormat("en-IN",{
    day:"numeric",
    month:"short"
  }).format(date);
}

function initials(name){
  return String(name || "F")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function clamp(value,min,max){
  return Math.min(max,Math.max(min,value));
}

function round(value,digits=0){
  const p=Math.pow(10,digits);
  return Math.round(value*p)/p;
}

function kgToLb(kg){
  return kg*2.20462;
}

function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

function vibrate(ms=18){
  if(navigator.vibrate) navigator.vibrate(ms);
}

/* =========================================================
   AUTH
   ========================================================= */

function renderAuth(){
  state.screen="auth";

  const mode=state.authMode;

  document.getElementById("app").innerHTML=`
    <div class="screen auth-wrap">
      <div class="auth-card">

        <div class="auth-logo">
          <div class="logo-mark"><span></span></div>
          <div class="brand">FITFORM</div>
        </div>

        <h1 class="auth-title">
          ${mode==="login" ? "Train with a plan." :
            mode==="create" ? "Build your system." :
            "Reset access."}
        </h1>

        <p class="auth-sub">
          ${mode==="login"
            ? "Your body, goals, schedule and training history. One system."
            : mode==="create"
            ? "Create your local FITFORM account and build a personalized plan."
            : "Enter your account email and choose a new local password."}
        </p>

        ${mode!=="forgot" ? `
          <div class="auth-tabs">
            <button class="auth-tab ${mode==="login"?"active":""}"
              onclick="switchAuth('login')">LOGIN</button>
            <button class="auth-tab ${mode==="create"?"active":""}"
              onclick="switchAuth('create')">CREATE ACCOUNT</button>
          </div>
        ` : ""}

        <form class="auth-form" onsubmit="submitAuth(event)">

          ${mode==="create" ? `
            <div class="field">
              <label>Full Name</label>
              <input id="authName" required autocomplete="name"
                placeholder="Your name">
            </div>
          ` : ""}

          <div class="field">
            <label>Email</label>
            <input id="authEmail" type="email" required autocomplete="email"
              placeholder="you@example.com">
          </div>

          <div class="field">
            <label>${mode==="forgot" ? "New Password" : "Password"}</label>
            <div class="password-row">
              <input id="authPassword" type="password" required
                minlength="4"
                autocomplete="${mode==="login"?"current-password":"new-password"}"
                placeholder="••••••••">
              <button type="button" class="eye-btn"
                onclick="togglePassword()">◉</button>
            </div>
          </div>

          ${mode==="create" || mode==="forgot" ? `
            <div class="field">
              <label>Confirm Password</label>
              <input id="authConfirm" type="password" required
                minlength="4" placeholder="••••••••">
            </div>
          ` : ""}

          <button class="primary-btn" type="submit">
            ${mode==="login" ? "LOGIN TO FITFORM" :
              mode==="create" ? "CREATE ACCOUNT" :
              "RESET PASSWORD"}
          </button>

        </form>

        <div class="auth-links">
          ${mode!=="forgot"
            ? `<button class="text-btn" onclick="switchAuth('forgot')">
                 Forgot password?
               </button>`
            : `<button class="text-btn" onclick="switchAuth('login')">
                 Back to login
               </button>`}

          ${mode!=="forgot"
            ? `<button class="text-btn" onclick="guestLogin()">
                 Continue as guest
               </button>`
            : ""}
        </div>

        <div class="demo-note">
          LOCAL DEMO AUTH: account data is stored only in this browser using
          localStorage. Do not use a real password here. Production
          authentication requires a secure backend and hashed passwords.
        </div>

      </div>
    </div>
  `;
}

function switchAuth(mode){
  state.authMode=mode;
  renderAuth();
}

function togglePassword(){
  const input=document.getElementById("authPassword");
  if(!input)return;
  input.type=input.type==="password"?"text":"password";
}

function submitAuth(event){
  event.preventDefault();

  const mode=state.authMode;
  const email=document.getElementById("authEmail").value.trim().toLowerCase();
  const password=document.getElementById("authPassword").value;

  if(!email || !password)return;

  const accounts=getAccounts();

  if(mode==="login"){
    const account=accounts.find(a=>a.email===email && a.password===password);

    if(!account){
      showToast("Invalid email or password.");
      return;
    }

    write(KEYS.session,{
      email:account.email,
      name:account.name,
      guest:false,
      loginAt:Date.now()
    });

    showToast("Welcome back.");
    enterApp();
    return;
  }

  if(mode==="create"){
    const name=document.getElementById("authName").value.trim();
    const confirm=document.getElementById("authConfirm").value;

    if(password!==confirm){
      showToast("Passwords do not match.");
      return;
    }

    if(accounts.some(a=>a.email===email)){
      showToast("An account with this email already exists.");
      return;
    }

    const account={
      id:"u_"+Date.now(),
      name:name || "FITFORM User",
      email,
      password,
      createdAt:Date.now()
    };

    accounts.push(account);
    write(KEYS.accounts,accounts);

    write(KEYS.session,{
      email:account.email,
      name:account.name,
      guest:false,
      loginAt:Date.now()
    });

    remove(KEYS.profile);
    remove(KEYS.plan);

    state.onboardingStep=0;
    state.onboardingData={name:account.name};

    renderOnboarding();
    return;
  }

  if(mode==="forgot"){
    const confirm=document.getElementById("authConfirm").value;

    if(password!==confirm){
      showToast("Passwords do not match.");
      return;
    }

    const index=accounts.findIndex(a=>a.email===email);

    if(index<0){
      showToast("No local account found for that email.");
      return;
    }

    accounts[index].password=password;
    write(KEYS.accounts,accounts);

    showToast("Password reset locally.");
    switchAuth("login");
  }
}

function guestLogin(){
  write(KEYS.session,{
    email:"guest@fitform.local",
    name:"Guest",
    guest:true,
    loginAt:Date.now()
  });

  if(currentProfile()){
    enterApp();
  }else{
    state.onboardingStep=0;
    state.onboardingData={name:"Guest"};
    renderOnboarding();
  }
}

function logout(){
  stopTimer();
  remove(KEYS.session);
  state.activePage="home";
  state.onboardingData={};
  state.onboardingStep=0;
  state.authMode="login";
  renderAuth();
}

/* =========================================================
   ONBOARDING DATA
   ========================================================= */

const QUESTIONS=[
  {
    id:"name",
    kicker:"01 · Identity",
    title:"What should we call you?",
    description:"Your plan will use this name throughout the app.",
    type:"text",
    placeholder:"e.g. Ayan"
  },
  {
    id:"age",
    kicker:"02 · Body profile",
    title:"How old are you?",
    description:"Age changes how estimates and training recommendations should be interpreted.",
    type:"number",
    unit:"years",
    min:13,
    max:100
  },
  {
    id:"sex",
    kicker:"03 · Body profile",
    title:"What is your sex?",
    description:"Used only for estimating energy requirements. You can choose not to say.",
    type:"choices",
    options:[
      ["male","Male",""],
      ["female","Female",""],
      ["other","Prefer not to say",""]
    ]
  },
  {
    id:"height",

   ========================================================= */

function renderOnboarding(){
  state.screen="onboarding";

  const q=QUESTIONS[state.onboardingStep];
  const data=state.onboardingData;

  const progress=((state.onboardingStep)/(QUESTIONS.length-1))*100;

  document.getElementById("app").innerHTML=`
    <div class="screen onboard">

      <div class="onboard-top">
        <div class="onboard-brand">
          <div class="mini-brand">FITFORM</div>
          <div class="progress-meta">
            ${state.onboardingStep+1} / ${QUESTIONS.length}
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
      </div>

      <div class="question" id="questionArea">
        <div class="question-kicker">${q.kicker}</div>
        <h1>${q.title}</h1>
        <p>${q.description}</p>

        ${renderQuestion(q,data)}
      </div>

      <div class="onboard-bottom">
        ${state.onboardingStep>0
          ? `<button class="back-btn" onclick="previousQuestion()">‹</button>`
          : ""}

        <button class="primary-btn next-btn" onclick="nextQuestion()">
          ${state.onboardingStep===QUESTIONS.length-1
            ? "BUILD MY FITFORM PLAN"
            : "CONTINUE"}
        </button>
      </div>

    </div>
  `;

  setTimeout(()=>{
    const first=document.querySelector("#questionArea input");
    if(first && !data[q.id]) first.focus();
  },100);
}

function renderQuestion(q,data){
  const value=data[q.id];

  if(q.type==="text"){
    return `
      <div class="field">
        <label>Your name</label>
        <input id="qInput" type="text"
          value="${escapeHTML(value||"")}"
          placeholder="${escapeHTML(q.placeholder||"")}"
          autocomplete="name">
      </div>
    `;
  }

  if(q.type==="number"){
    return `
      <div class="field">
        <label>${q.unit}</label>
        <div class="number-field">
          <input id="qInput" type="number"
            min="${q.min}" max="${q.max}"
            value="${value ?? ""}"
            placeholder="Enter value">
          <span>${q.unit}</span>
        </div>
      </div>
    `;
  }

  if(q.type==="choices"){
    return `
      <div class="choice-grid">
        ${q.options.map(opt=>`
          <button
            type="button"
            class="choice ${value===opt[0]?"selected":""}"
            onclick="selectChoice('${escapeHTML(opt[0])}')">
            <div class="choice-title">${escapeHTML(opt[1])}</div>
            ${opt[2]?`<div class="choice-sub">${escapeHTML(opt[2])}</div>`:""}
          </button>
        `).join("")}
      </div>
    `;
  }

  if(q.type==="dynamicGoal"){
    const goal=data.goal || "health";
    let options=[];

    if(goal==="lose_fat"){
      options=[
        ["conservative","Slow & steady","Smaller deficit, easier to sustain"],
        ["moderate","Moderate","Balanced pace with muscle protection"],
        ["unsure","I’m not sure","Use a conservative starting point"]
      ];
    }

    if(goal==="build_muscle"){
      options=[
        ["hypertrophy","Muscle growth","Prioritize hypertrophy"],
        ["lean","Lean muscle","Controlled gain with minimal excess"],
        ["hybrid","Muscle + strength","Balanced size and strength"]
      ];
    }

    if(goal==="gain_weight"){
      options=[
        ["general","General weight gain","Simple controlled surplus"],
        ["lean","Lean gain","Smaller surplus with performance focus"]
      ];
    }

    if(goal==="get_stronger"){
      options=[
        ["strength","Overall strength","Build broad strength"],
        ["gym_strength","Gym strength","Focus on compound lifts"],
        ["athletic","Athletic performance","Strength plus power and movement"]
      ];
    }

    if(["fitness","health"].includes(goal)){
      options=[
        ["consistency","Consistency","Build a routine you can actually keep"],
        ["fitness","Fitness","Improve conditioning and work capacity"],
        ["strength","Strength","Add a stronger resistance-training focus"]
      ];
    }

    return `
      <div class="choice-grid">
        ${options.map(opt=>`
          <button
            type="button"
            class="choice ${value===opt[0]?"selected":""}"
            onclick="selectChoice('${escapeHTML(opt[0])}')">
            <div class="choice-title">${escapeHTML(opt[1])}</div>
            <div class="choice-sub">${escapeHTML(opt[2])}</div>
          </button>
        `).join("")}
      </div>
    `;
  }

  return "";
}

function selectChoice(value){
  const q=QUESTIONS[state.onboardingStep];
  state.onboardingData[q.id]=value;
  renderOnboarding();
}

function validateQuestion(){
  const q=QUESTIONS[state.onboardingStep];
  let value;

  if(q.type==="text" || q.type==="number"){
    const input=document.getElementById("qInput");
    if(!input)return false;

    value=input.value.trim();

    if(!value){
      showToast("Please enter a value.");
      input.focus();
      return false;
    }

    if(q.type==="number"){
      const n=Number(value);

      if(!Number.isFinite(n) || n<q.min || n>q.max){
        showToast(`Enter a value between ${q.min} and ${q.max}.`);
        input.focus();
        return false;
      }

      value=n;
    }

    state.onboardingData[q.id]=value;
  }

  if(q.type==="choices" || q.type==="dynamicGoal"){
    if(!state.onboardingData[q.id]){
      showToast("Choose an option to continue.");
      return false;
    }
  }

  return true;
}

function nextQuestion(){
  if(!validateQuestion())return;

  vibrate();

  if(state.onboardingStep<QUESTIONS.length-1){
    state.onboardingStep++;
    write(KEYS.onboarding,state.onboardingData);
    renderOnboarding();
  }else{
    finishOnboarding();
  }
}

function previousQuestion(){
  if(state.onboardingStep>0){
    state.onboardingStep--;
    renderOnboarding();
  }
}

/* =========================================================
   FITNESS CALCULATIONS
   ========================================================= */

function calculateBMR(p){
  const age=Number(p.age);
  const weight=Number(p.weight);
  const height=Number(p.height);

  if(p.sex==="male"){
    return 10*weight + 6.25*height - 5*age + 5;
  }

  if(p.sex==="female"){
    return 10*weight + 6.25*height - 5*age - 161;
  }

  return 10*weight + 6.25*height - 5*age - 78;
}

function activityMultiplier(activity){
  return {
    sedentary:1.2,
    light:1.35,
    moderate:1.5,
    very:1.7
  }[activity] || 1.35;
}

function calculateTDEE(p){
  return calculateBMR(p)*activityMultiplier(p.activity);
}

function calculateBMI(p){
  const h=Number(p.height)/100;
  const w=Number(p.weight);

  if(!h)return 0;

  return w/(h*h);
}

function bmiCategory(bmi){
  if(bmi<18.5)return "Below typical range";
  if(bmi<25)return "Typical range";
  if(bmi<30)return "Above typical range";
  return "High range";
}

function calculateCalories(p){
  const tdee=calculateTDEE(p);

  /*
    Minors should not be placed on restrictive calorie targets.
    This app therefore uses maintenance-style guidance for <18.
  */
  if(Number(p.age)<18){
    return {
      calories:Math.round(tdee),
      mode:"maintenance_guidance"
    };
  }

  let calories=tdee;

  if(p.goal==="lose_fat"){
    const deficit=
      p.approach==="conservative" ? .10 :
      p.approach==="moderate" ? .15 :
      .10;

    calories=tdee*(1-deficit);
  }

  if(p.goal==="build_muscle"){
    calories=tdee*(p.approach==="hypertrophy" ? 1.08 : 1.05);
  }

  if(p.goal==="gain_weight"){
    calories=tdee*(p.approach==="general" ? 1.10 : 1.07);
  }

  if(p.goal==="get_stronger"){
    calories=tdee*1.03;
  }

  if(p.goal==="fitness" || p.goal==="health"){
    calories=tdee;
  }

  return {
    calories:Math.round(calories),
    mode:"estimate"
  };
}

function calculateProtein(p){
  const w=Number(p.weight);

  let factor=1.5;

  if(p.goal==="lose_fat")factor=1.7;
  if(p.goal==="build_muscle")factor=1.8;
  if(p.goal==="gain_weight")factor=1.6;
  if(p.goal==="get_stronger")factor=1.7;
  if(p.goal==="fitness")factor=1.5;
  if(p.goal==="health")factor=1.4;

  if(Number(p.age)<18)factor=1.3;

  return Math.round(w*factor);
}

function calculateStepTarget(p){
  const current=Number(p.steps)||4000;

  let target=current;

  if(p.activity==="sedentary"){
    target=Math.max(6000,current+1500);
  }

  if(p.activity==="light"){
    target=Math.max(7000,current+1000);
  }

  if(p.activity==="moderate"){
    target=Math.max(8000,current+500);
  }

  if(p.activity==="very"){
    target=Math.max(9000,current);
  }

  if(p.goal==="lose_fat"){
    target=Math.max(target,8000);
  }

  return Math.min(Math.round(target/500)*500,12000);
}

function cloneExercise(key,experience){
  const base=EXERCISES[key];

  if(!base)return null;

  const copy={...base};

  if(experience==="beginner"){
    copy.sets=Math.max(2,copy.sets-1);
  }

  if(experience==="advanced"){
    if(copy.sets<4 && !["walking","mountain"].includes(key)){
      copy.sets++;
    }
  }

  return {
    key,
    ...copy,
    id:key+"_"+Math.random().toString(36).slice(2,8),
    done:false
  };
}

function equipmentExercises(p){
  const e=p.equipment;
  const loc=p.location;

  if(e==="full_gym" || loc==="gym"){
    return {
      push:["chestPress","inclinePress","shoulderPress","lateralRaise","triceps"],
      pull:["pulldown","row","curl"],
      legs:["squat","rdl","legPress","legCurl","calf","core"]
    };
  }

  if(e==="dumbbells"){
    return {
      push:["backpackPress","pikePushup","lateralRaise","triceps"],
      pull:["row","curl"],
      legs:["bodySquat","splitSquat","rdl","calf","core"]
    };
  }

  if(e==="bands"){
    return {
      push:["pushup","pikePushup","bandRow","bandCurl"],
      pull:["bandPulldown","bandRow","bandCurl"],
      legs:["bodySquat","splitSquat","hipHinge","calf","core"]

  };
}

  return {

    focus:name,
    exercises:keys.map(k=>cloneExercise(k,p.experience))
  };
}

      generateWorkout("Upper",p,[
        eq.push[0],eq.pull[0],eq.push[1]||eq.push[0],eq.pull[1]||eq.pull[0]
      ]),
      generateWorkout("Lower + Core",p,[
        eq.legs[1]||eq.legs[0],eq.legs[2]||eq.legs[1],
        eq.legs[3]||eq.legs[1],eq.legs[5]||eq.legs[4]
      ])
    ];
  }

  return workouts;
}

   ========================================================= */

const FOOD_LIBRARY={
  vegetarian:[
    "Paneer",
    "Greek yogurt / curd",
    "Milk",
    "Dal",
    "Rajma / chole",
    "Soy chunks / tofu",
    "Rice",
    "Roti",
    "Oats",
    "Vegetables",
    "Fruit",
    "Nuts and seeds"
  ],
  eggetarian:[
    "Eggs",
    "Paneer",
    "Greek yogurt / curd",
    "Milk",
    "Dal",
    "Soy chunks / tofu",
    "Rice",
    "Roti",
    "Oats",
    "Vegetables",
    "Fruit"
  ],
  nonveg:[
    "Eggs",
    "Chicken",
    "Fish",
    "Lean meat",
    "Greek yogurt / curd",
    "Rice",
    "Roti",
    "Oats",
    "Vegetables",
    "Fruit",
    "Nuts and seeds"
  ],
  vegan:[
    "Tofu",
    "Soy chunks",
    "Tempeh",
    "Dal",
    "Rajma / chole",
    "Peas",
    "Oats",
    "Rice",
    "Roti",
    "Vegetables",
    "Fruit",
    "Nuts and seeds"
  ]
};

function generateMeals(p,calories,protein){
  const count=
    p.meals==="2" ? 2 :
    p.meals==="3" ? 3 :
    p.meals==="4" ? 4 : 5;

  const foods=FOOD_LIBRARY[p.diet] || FOOD_LIBRARY.vegetarian;

  const names=[
    "Meal 1",
    "Meal 2",
    "Meal 3",
    "Meal 4",
    "Meal 5"
  ];

  const distributions=
    count===2 ? [.45,.55] :
    count===3 ? [.3,.35,.35] :
    count===4 ? [.25,.25,.25,.25] :
    [.2,.2,.2,.2,.2];

  return Array.from({length:count},(_,i)=>{
    const c=Math.round(calories*distributions[i]);

    const start=(i*3)%foods.length;
    const selected=[
      foods[start],
      foods[(start+1)%foods.length],
      foods[(start+2)%foods.length]
    ];

    return {
      name:names[i],
      calories:c,
      protein:Math.round(protein*distributions[i]),
      foods:selected
    };
  });
}

function nutritionNote(p){
  if(Number(p.age)<18){
    return "Because you are under 18, FITFORM does not prescribe restrictive calorie targets. Focus on regular meals, protein-rich foods, fruits, vegetables, hydration and adequate sleep, with guidance from a parent/guardian or qualified professional.";
  }

  if(p.goal==="lose_fat"){
    return "Use a moderate calorie deficit, prioritize protein and high-volume foods, and keep resistance training consistent.";
  }

  if(p.goal==="build_muscle" || p.goal==="gain_weight"){
    return "Prioritize protein, carbohydrate-rich training fuel and a small calorie surplus. Increase food gradually if body weight is not moving.";
  }

  return "Build meals around protein, minimally processed carbohydrate sources, vegetables or fruit, and enough dietary fat for a sustainable routine.";
}

/* =========================================================
   PLAN GENERATION
   ========================================================= */

function generatePlan(p){
  const bmr=Math.round(calculateBMR(p));
  const tdee=Math.round(calculateTDEE(p));
  const calorieData=calculateCalories(p);
  const protein=calculateProtein(p);
  const steps=calculateStepTarget(p);
  const bmi=round(calculateBMI(p),1);

  const workouts=generateWorkouts(p);

  const meals=generateMeals(
    p,
    calorieData.calories,
    protein
  );

  return {
    createdAt:Date.now(),
    bmr,
    tdee,
    calories:calorieData.calories,
    calorieMode:calorieData.mode,
    protein,
    steps,
    bmi,
    bmiCategory:bmiCategory(bmi),
    workouts,
    meals,
    nutritionNote:nutritionNote(p),
    progression:{
      rule:
        p.goal==="get_stronger"
        ? "When you can complete all prescribed reps with clean form, add a small amount of load next time."
        : "When you consistently hit the top of the rep range with clean form, increase load slightly or add a rep."
    }
  };
}

function finishOnboarding(){
  const p={
    ...state.onboardingData,
    createdAt:Date.now(),
    updatedAt:Date.now()
  };

  write(KEYS.profile,p);

  const plan=generatePlan(p);
  write(KEYS.plan,plan);

  const progress=currentProgress();

  if(progress.weights.length===0){
    progress.weights.push({
      date:todayKey(),
      weight:Number(p.weight)
    });
  }

  write(KEYS.progress,progress);
  remove(KEYS.onboarding);

  state.activePage="home";

  showLoadingThenApp();
}

function toggleExercise(index){
  const workout=state.currentWorkout;

  if(!workout || !workout.exercises[index])return;

  workout.exercises[index].done=!workout.exercises[index].done;

  vibrate();
  renderWorkoutSession();
}

function completeWorkout(){
  const workout=state.currentWorkout;

  if(!workout)return;

  const doneCount=workout.exercises.filter(e=>e.done).length;

  if(doneCount===0){
    showToast("Complete at least one exercise first.");
    return;
  }

  stopTimer();

  const progress=currentProgress();

  progress.workouts=progress.workouts || [];

  progress.workouts.push({
    id:"w_"+Date.now(),
    date:todayKey(),
    timestamp:Date.now(),
    workoutName:workout.name,
    completedExercises:doneCount,
    totalExercises:workout.exercises.length,
    durationSeconds:state.timer
  });

  updateStreak(progress);

  write(KEYS.progress,progress);

  state.currentWorkout=null;

  showWorkoutComplete();
}

function updateStreak(progress){
  const dates=[...new Set(
    progress.workouts.map(w=>w.date)
  )].sort().reverse();

  let streak=0;
  let cursor=new Date();

  for(const date of dates){
    const key=cursor.toISOString().slice(0,10);

    if(date===key){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }else if(date<key){
      break;
    }
  }

  progress.currentStreak=streak;
  progress.bestStreak=Math.max(
    progress.bestStreak||0,
    streak
  );
}

function startTimer(){
  if(state.timerRunning)return;

  state.timerRunning=true;

  state.timerInterval=setInterval(()=>{
    state.timer++;
    updateTimerDOM();
  },1000);

  updateTimerDOM();
}

function toggleTimer(){
  if(state.timerRunning){
    stopTimer();
  }else{
    startTimer();
  }

  const btn=document.getElementById("timerToggle");
  if(btn)btn.textContent=state.timerRunning?"Ⅱ":"▶";
}

function stopTimer(){
  state.timerRunning=false;

  if(state.timerInterval){
    clearInterval(state.timerInterval);
    state.timerInterval=null;
  }
}

function resetTimer(){
  state.timer=0;
  updateTimerDOM();
}

function updateTimerDOM(){
  const el=document.getElementById("timerValue");
  if(!el)return;

  const min=Math.floor(state.timer/60);
  const sec=state.timer%60;

  el.textContent=
    String(min).padStart(2,"0")+":"+
    String(sec).padStart(2,"0");

  const btn=document.getElementById("timerToggle");
  if(btn)btn.textContent=state.timerRunning?"Ⅱ":"▶";
}

function renderWeightChart(weights){
  if(weights.length<2){
    return `
      <div class="chart-empty">
        Log at least two weight entries to create a trend chart.
      </div>
    `;
  }

  const data=weights.slice(-12);
  const values=data.map(x=>Number(x.weight));
  const min=Math.min(...values)-1;
  const max=Math.max(...values)+1;

  const width=500;
  const height=170;

  const points=data.map((item,i)=>{
    const x=data.length===1
      ? width/2
      : (i/(data.length-1))*width;

    const y=height-
      ((Number(item.weight)-min)/(max-min))*130-20;

    return [x,y];
  });

  const polyline=points.map(p=>p.join(",")).join(" ");

  return `
    <div class="chart">
      <svg viewBox="0 0 ${width} ${height}"
        preserveAspectRatio="none">

        <polyline
          points="${polyline}"
          fill="none"
          stroke="var(--accent)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round">
        </polyline>

        ${points.map(p=>`
          <circle
            cx="${p[0]}"
            cy="${p[1]}"
            r="4"
            fill="var(--accent)">
          </circle>
        `).join("")}

      </svg>
    </div>

    <div style="
      display:flex;
      justify-content:space-between;
      margin-top:9px;
      color:var(--muted);
      font-size:9px;
    ">
      <span>${shortDate(new Date(data[0].date))}</span>
      <span>${shortDate(new Date(data[data.length-1].date))}</span>
    </div>
  `;
}

function renderRecentActivity(progress){
  const activities=[...(progress.workouts||[])]
    .sort((a,b)=>b.timestamp-a.timestamp)
    .slice(0,7);

  if(!activities.length){
    return `
      <section class="card empty">
        No workouts logged yet. Your first completed session will appear here.
      </section>
    `;
  }

  return `
    <div class="history">
      ${activities.map(a=>`
        <div class="history-item">
          <div>
            <strong>${escapeHTML(a.workoutName)}</strong>
            <span style="display:block;margin-top:4px">
              ${a.completedExercises}/${a.totalExercises} exercises
            </span>
          </div>

          <span>${shortDate(new Date(a.timestamp))}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function logWeight(){
  const input=document.getElementById("weightLogInput");
  const date=document.getElementById("weightLogDate");

  const weight=Number(input.value);

  if(!weight || weight<25 || weight>300){
    showToast("Enter a valid weight.");
    return;
  }

  const progress=currentProgress();

  progress.weights=progress.weights||[];

  progress.weights=progress.weights.filter(
    x=>x.date!==date.value
  );

  progress.weights.push({
    date:date.value,
    weight:round(weight,1)
  });

  progress.weights.sort((a,b)=>
    new Date(a.date)-new Date(b.date)
  );

  write(KEYS.progress,progress);

  showToast("Weight saved.");
  renderPage();
}

function openModal(content){
  const existing=document.getElementById("modalLayer");

  if(existing)existing.remove();

  layer.id="modalLayer";
  layer.className="modal-layer";

  layer.innerHTML=`

      ${content}

  layer.addEventListener("click",e=>{
    if(e.target===layer)closeModal();
  });

  document.body.appendChild(layer);
}

  if(layer)layer.remove();
}

function openChat(){

  document.body.insertAdjacentHTML("beforeend",`

              role:"bot",

            })}
      </div>

      <div class="chat-suggestions">
        ${[
          "What should I eat today?",
          "What's today's workout?",
          "How much protein do I need?",

          autocomplete="off">
        <button class="chat-send">↑</button>
      </form>

    </div>
  `);

  const box=document.getElementById("chatMessages");
  if(box)box.scrollTop=box.scrollHeight;
}

function closeChat(){
  const panel=document.getElementById("chatPanel");
  if(panel)panel.remove();
}

function renderMessage(message){
  return `
    <div class="message ${message.role==="user"?"user":"bot"}">
      ${escapeHTML(message.text).replace(/\n/g,"<br>")}
    </div>
  `;
}

function chatWelcome(){
  const p=currentProfile();

  if(!p){
    return "I’m FITFORM. Complete your profile first and I can give you context-aware training and nutrition guidance.";
  }

  return `
    I’ve got your FITFORM profile loaded, ${p.name.split(" ")[0]}.
    I can help with today's workout, nutrition structure, protein,
    progression, recovery, missed sessions and equipment substitutions.
  `;
}

function sendChatSuggestion(text){
  const input=document.getElementById("chatInput");
  if(input){
    input.value=text;
    input.focus();
  }

  sendChat(new Event("submit"));
}

function sendChat(event){
  event.preventDefault();

  const input=document.getElementById("chatInput");
  if(!input)return;

  const text=input.value.trim();

  if(!text)return;

  const chat=getChat();

  chat.push({
    role:"user",
    text,
    timestamp:Date.now()
  });

  saveChat(chat);

  const messages=document.getElementById("chatMessages");

  if(messages){
    messages.insertAdjacentHTML(
      "beforeend",
      renderMessage({
        role:"user",
        text
      })
    );

    messages.insertAdjacentHTML(
      "beforeend",
      `<div id="typingMessage" class="message bot">
        <div class="typing">
          <i></i><i></i><i></i>
        </div>
      </div>`
    );

    messages.scrollTop=messages.scrollHeight;
  }

  input.value="";

  setTimeout(()=>{
    const response=generateChatResponse(text);

    const typing=document.getElementById("typingMessage");
    if(typing)typing.remove();

    const updated=getChat();

    updated.push({
      role:"bot",
      text:response,
      timestamp:Date.now()
    });

    saveChat(updated);

    const box=document.getElementById("chatMessages");

    if(box){
      box.insertAdjacentHTML(
        "beforeend",
        renderMessage({
          role:"bot",
          text:response
        })
      );

      box.scrollTop=box.scrollHeight;
    }
  },500);
}

function generateChatResponse(raw){
  const text=raw.toLowerCase();
  const p=currentProfile();
  const plan=currentPlan();
  const progress=currentProgress();
  const meals=currentMeals();

  if(!p || !plan){
    return "Complete your FITFORM profile first. Without your stats and goal, I’d just be guessing, which is how fitness advice on the internet became such a spectacular mess.";
  }

  const first=p.name.split(" ")[0];

  if(
    text.includes("protein") ||
    text.includes("how much protein")
  ){
    return `${first}, your current FITFORM starting target is about ${plan.protein} g protein/day. Spread it across your ${p.meals} preferred meals and prioritize protein-rich foods that fit your ${pretty(p.diet)} diet.`;
  }

  if(
    text.includes("today") &&
    (
      text.includes("workout") ||
      text.includes("training")
    )
  ){
    const workout=plan.workouts[0];

    return `Today's suggested session is ${workout.name}. It has ${workout.exercises.length} exercises. Start with ${workout.exercises[0].name}, then continue through the list in FITFORM. Your progression rule: ${plan.progression.rule}`;
  }

  if(
    text.includes("eat") ||
    text.includes("meal") ||
    text.includes("food")
  ){
    const today=meals[todayKey()]||[];
    const eaten=today.reduce(
      (s,m)=>s+Number(m.calories||0),0
    );

    const next=plan.meals.findIndex((m,i)=>
      !today.some(x=>x.planIndex===i)
    );

    if(next>=0){
      const m=plan.meals[next];

      return `Your next planned meal is ${m.name}: around ${m.calories} kcal and ${m.protein} g protein. Suggested food pool: ${m.foods.join(", ")}. You've logged approximately ${eaten} kcal today against a starting estimate of ${plan.calories} kcal.`;
    }

    return `You've logged all planned meals for today. Focus on hunger, fullness, hydration and overall food quality rather than trying to force extra food simply because an app produced a number.`;
  }

  if(
    text.includes("missed") &&
    text.includes("workout")
  ){
    return `Missing one workout is not a disaster. Do not try to punish yourself with a double session. Move the missed workout to the next realistic training day, keep the remaining sessions spaced out, and resume normal progression. Consistency over months matters more than one missed box on a calendar.`;
  }

  if(
    text.includes("not progressing") ||
    text.includes("not making progress") ||
    text.includes("stuck")
  ){
    const recent=progress.weights||[];

    if(recent.length<2){
      return `Before changing the plan, collect at least a few consistent data points. Track body weight under similar conditions, workouts completed, approximate nutrition consistency and recovery. Your current target is ${plan.calories} kcal and ${plan.protein} g protein, but real-world adherence matters more than theoretical precision.`;
    }

    return `Check the basics first: are you actually completing the planned workouts, getting close to ${plan.protein} g protein, maintaining reasonable nutrition consistency, sleeping enough, and progressing reps or load? If those are consistent for several weeks and the trend is still flat, the plan can be recalculated.`;
  }

  if(
    text.includes("home workout") ||
    text.includes("at home")
  ){
    return `For your ${pretty(p.equipment)} setup, a simple home session can use push-ups, pike push-ups, squats, split squats, hip hinges, rows with bands/backpack if available, and a core movement. Use 2–3 working sets per movement and keep 1–3 good reps in reserve rather than chasing exhaustion.`;
  }

  if(
    text.includes("exercise") &&
    (
      text.includes("explain") ||
      text.includes("how")
    )
  ){
    return `For any exercise, prioritize stable setup, controlled range of motion, repeatable technique and a load you can control. If you feel sharp, unusual or worsening pain, stop that movement rather than trying to "push through" it. Fitness apps are not worth an injury.`;
  }

  if(
    text.includes("calorie") ||
    text.includes("calories")
  ){
    return `Your current estimated starting target is ${plan.calories} kcal/day, based on an estimated maintenance level around ${plan.tdee} kcal. This is an estimate, not a laboratory measurement. Your goal is ${goalLabel(p.goal)}. If you're under 18, FITFORM intentionally avoids restrictive calorie targets.`;
  }

  if(
    text.includes("sleep") ||
    text.includes("recovery")
  ){
    return `Your profile reports ${pretty(p.sleep)} sleep. Prioritize a consistent sleep schedule, enough total sleep, sensible training volume and rest between hard sessions. If recovery is poor, adding more training is usually not the brilliant plot twist people hope it is.`;
  }

  if(
    text.includes("steps") ||
    text.includes("walking")
  ){
    return `Your FITFORM step target is ${plan.steps.toLocaleString()} per day, based on your current movement and activity level. You don't need to hit it perfectly every day. Build toward it gradually and avoid turning step tracking into another source of unnecessary stress.`;
  }

  if(
    text.includes("progression") ||
    text.includes("progressive overload") ||
    text.includes("stronger")
  ){
    return `${plan.progression.rule} Keep technique consistent so increases in load or reps actually mean something.`;
  }

  if(
    text.includes("goal") ||
    text.includes("plan")
  ){
    return `Your current goal is ${goalLabel(p.goal)} using a ${pretty(p.approach)} approach. FITFORM has you at roughly ${plan.calories} kcal, ${plan.protein} g protein and ${plan.steps.toLocaleString()} daily steps, with ${p.trainingDays} training days per week.`;
  }

  return `Based on your profile, I'd keep the focus on your main goal, consistent training, roughly ${plan.protein} g protein/day, your ${plan.steps.toLocaleString()} step target and adequate recovery. If you're asking about a specific exercise, meal, workout or progress problem, mention it directly and I'll use your stored FITFORM context.`;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

function animateRings(){
  document.querySelectorAll(".ring-progress").forEach(ring=>{
    const percent=Number(ring.dataset.progress)||0;
    const circumference=301.59;

    requestAnimationFrame(()=>{
      ring.style.strokeDashoffset=
        circumference-(circumference*percent/100);
    });
  });
}

function animateNumbers(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target=Number(el.dataset.count);

    if(!Number.isFinite(target))return;

    const duration=650;
    const start=performance.now();

    function frame(now){
      const progress=clamp(
        (now-start)/duration,
        0,1
      );

      const eased=1-Math.pow(1-progress,3);

      el.textContent=
        Math.round(target*eased).toLocaleString();

      if(progress<1){
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

    const splash=document.getElementById("splash");
    if(splash)splash.classList.add("hide");

    const session=currentSession();

    if(!session){
      renderAuth();
      return;
    }

    enterApp();
  },900);
}

  stopTimer();
});

window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeModal();
    closeChat();
  }
});

init();
