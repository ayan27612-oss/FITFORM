<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#07090d">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>FITFORM</title>

<style>

/* ============================================================
   FITFORM PERFORMANCE EDITION
   ------------------------------------------------------------
   Single-file application
   No frameworks
   No external libraries
   No external images
   No network dependency

   PERFORMANCE PRINCIPLES
   ------------------------------------------------------------
   1. Avoid unnecessary DOM destruction.
   2. Animate transform and opacity instead of layout properties.
   3. Keep onboarding shell mounted.
   4. Keep timer isolated.
   5. Avoid scroll manipulation during question transitions.
   6. Avoid continuous expensive blur/shadow animations.
   7. Respect reduced-motion preference.
   ============================================================ */


/* ============================================================
   ROOT TOKENS
   ============================================================ */

:root{

  --bg:#07090d;
  --bg-soft:#0a0d12;

  --panel:#10141b;
  --panel-2:#151a22;
  --panel-3:#1b2029;

  --text:#f5f7fa;
  --text-soft:#c9d0d9;

  --muted:#8d96a5;
  --muted-2:#667080;

  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.13);

  --accent:#c8ff38;
  --accent-dark:#9ee900;

  --success:#62e6a5;
  --danger:#ff6673;
  --warning:#ffca55;
  --info:#70a7ff;

  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:17px;
  --radius-sm:13px;

  --nav-height:72px;

  --ease:cubic-bezier(.22,.8,.22,1);
}


/* ============================================================
   RESET
   ============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  min-height:100%;
  background:var(--bg);
  color-scheme:dark;
  scroll-behavior:auto;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 85% -10%,
      rgba(200,255,56,.065),
      transparent 28%
    ),
    radial-gradient(
      circle at -10% 35%,
      rgba(112,167,255,.035),
      transparent 25%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;
  overscroll-behavior-x:none;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

img,
svg{
  max-width:100%;
}

.hidden{
  display:none!important;
}


/* ============================================================
   REDUCED MOTION
   ============================================================ */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }

}


/* ============================================================
   SPLASH
   ============================================================ */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#07090d;

  opacity:1;
  visibility:visible;

  transition:
    opacity .35s ease,
    visibility .35s ease;
}

#splash.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-content{
  text-align:center;
  animation:
    splashEnter .55s var(--ease) both;
}

@keyframes splashEnter{
  from{
    opacity:0;
    transform:translate3d(0,18px,0) scale(.96);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
}

.logo-mark{
  width:72px;
  height:72px;

  margin:0 auto;

  border:2px solid var(--accent);
  border-radius:23px;

  position:relative;

  transform:rotate(-8deg);

  box-shadow:
    0 0 0 7px rgba(200,255,56,.035),
    0 0 38px rgba(200,255,56,.10);
}

.logo-mark::before,
.logo-mark::after{
  content:"";

  position:absolute;

  width:30px;
  height:4px;

  top:50%;
  left:50%;

  margin-left:-15px;
  margin-top:-2px;

  background:var(--accent);
  border-radius:10px;
}

.logo-mark::before{
  transform:rotate(45deg);
}

.logo-mark::after{
  transform:rotate(-45deg);
}

.logo-dot{
  position:absolute;

  width:8px;
  height:8px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;
  background:var(--accent);
}

.brand{
  margin-top:18px;

  font-size:25px;
  font-weight:950;

  letter-spacing:.16em;
}

.splash-subtitle{
  margin-top:7px;

  color:var(--muted);

  font-size:9px;
  font-weight:700;

  letter-spacing:.22em;
}


/* ============================================================
   GLOBAL SCREEN TRANSITION
   ============================================================ */

.screen{
  min-height:100vh;
}

.screen-enter{
  animation:
    screenEnter .28s var(--ease) both;
}

@keyframes screenEnter{

  from{
    opacity:0;
    transform:translate3d(0,8px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}


/* ============================================================
   AUTH
   ============================================================ */

.auth-screen{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    max(22px,env(safe-area-inset-top))
    20px
    max(22px,env(safe-area-inset-bottom));

  contain:layout paint;
}

.auth-card{
  width:100%;
  max-width:430px;

  padding:27px;

  border:1px solid var(--line);
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(18,23,30,.98),
      rgba(10,13,18,.98)
    );

  box-shadow:0 20px 55px rgba(0,0,0,.28);

  animation:
    authCardEnter .4s var(--ease) both;
}

@keyframes authCardEnter{
  from{
    opacity:0;
    transform:translate3d(0,16px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }
}

.auth-brand{
  display:flex;
  align-items:center;
  gap:11px;

  margin-bottom:30px;
}

.auth-brand .logo-mark{
  width:45px;
  height:45px;

  margin:0;

  border-radius:14px;

  box-shadow:none;
}

.auth-brand .logo-mark::before,
.auth-brand .logo-mark::after{
  width:19px;
  margin-left:-9.5px;
  height:3px;
}

.auth-brand .brand{
  margin:0;
  font-size:18px;
}

.auth-title{
  margin:0 0 9px;

  font-size:34px;
  line-height:1;

  font-weight:950;
  letter-spacing:-.045em;
}

.auth-description{
  margin:0 0 23px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;

  padding:4px;
  gap:4px;

  margin-bottom:20px;

  background:#080b0f;

  border:1px solid var(--line);
  border-radius:14px;
}

.auth-tab{
  min-height:39px;

  border:0;
  border-radius:10px;

  background:transparent;
  color:var(--muted);

  font-size:11px;
  font-weight:900;
}

.auth-tab.active{
  background:var(--panel-2);
  color:var(--text);
}

.auth-form{
  display:grid;
  gap:13px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  color:var(--text-soft);

  font-size:10px;
  font-weight:850;

  text-transform:uppercase;
  letter-spacing:.1em;
}

.field input,
.field select,
.field textarea{
  width:100%;

  min-height:48px;

  padding:13px;

  border:1px solid var(--line-strong);
  border-radius:14px;

  outline:none;

  background:#0a0d12;
  color:var(--text);

  transition:
    border-color .18s ease,
    box-shadow .18s ease;
}

.field textarea{
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:rgba(200,255,56,.6);

  box-shadow:
    0 0 0 3px rgba(200,255,56,.06);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:50px;
}

.password-toggle{
  position:absolute;

  right:6px;
  top:6px;

  width:36px;
  height:36px;

  border:0;
  border-radius:10px;

  background:transparent;
  color:var(--muted);
}

.primary-btn,
.secondary-btn,
.danger-btn{
  min-height:50px;

  width:100%;

  border-radius:15px;

  font-size:12px;
  font-weight:900;

  transition:
    transform .12s ease,
    filter .18s ease;
}

.primary-btn{
  border:0;

  background:var(--accent);
  color:#101400;

  box-shadow:
    0 9px 25px rgba(200,255,56,.09);
}

.secondary-btn{
  border:1px solid var(--line);

  background:var(--panel-2);
  color:var(--text);
}

.danger-btn{
  border:1px solid rgba(255,102,115,.16);

  background:rgba(255,102,115,.08);
  color:#ff929b;
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active,
.icon-btn:active{
  transform:scale(.975);
}

.auth-links{
  display:flex;
  justify-content:space-between;

  margin-top:14px;
}

.text-btn{
  padding:4px 0;

  border:0;

  background:transparent;
  color:var(--muted);

  font-size:11px;
  font-weight:700;
}

.demo-note{
  margin-top:17px;

  padding:11px;

  border:1px solid rgba(255,202,85,.11);
  border-radius:12px;

  background:rgba(255,202,85,.035);

  color:#aa9e78;

  font-size:9px;
  line-height:1.55;
}


/* ============================================================
   ONBOARDING SHELL
   ------------------------------------------------------------
   IMPORTANT PERFORMANCE AREA
   The shell remains mounted.
   Only #questionContent changes.
   ============================================================ */

.onboarding-screen{
  min-height:100vh;

  width:100%;
  max-width:650px;

  margin:0 auto;

  display:flex;
  flex-direction:column;

  padding:
    12px 20px
    max(25px,env(safe-area-inset-bottom));

  contain:layout;
}

.onboarding-header{
  flex:none;

  padding:
    4px 0
    17px;

  background:
    linear-gradient(
      var(--bg) 70%,
      rgba(7,9,13,0)
    );

  position:relative;
  z-index:5;
}

.onboarding-brand-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:17px;
}

.onboarding-brand{
  font-size:13px;
  font-weight:950;

  letter-spacing:.17em;
}

.onboarding-counter{
  color:var(--muted);

  font-size:10px;
  font-weight:800;
}

.progress-track{
  width:100%;
  height:4px;

  overflow:hidden;

  border-radius:100px;

  background:#171b21;
}

.progress-fill{
  height:100%;
  width:100%;

  transform-origin:left center;
  transform:scaleX(0);

  border-radius:inherit;

  background:var(--accent);

  will-change:transform;

  transition:
    transform .38s var(--ease);
}


/* ============================================================
   QUESTION VIEWPORT
   ------------------------------------------------------------
   We don't animate height.
   This prevents mobile layout jumping.
   ============================================================ */

.question-viewport{
  position:relative;

  flex:1;

  min-height:0;

  overflow:hidden;

  padding-top:23px;
}

.question-content{
  width:100%;

  animation:
    questionEnter .25s var(--ease) both;

  will-change:transform,opacity;
}

@keyframes questionEnter{

  from{
    opacity:0;
    transform:translate3d(16px,0,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}

.question-kicker{
  margin-bottom:11px;

  color:var(--accent);

  font-size:9px;
  font-weight:950;

  letter-spacing:.17em;
  text-transform:uppercase;
}

.question-title{
  margin:0 0 10px;

  font-size:
    clamp(30px,8vw,48px);

  line-height:.98;

  font-weight:950;

  letter-spacing:-.047em;
}

.question-description{
  margin:0 0 24px;

  max-width:560px;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}

.choice-grid{
  display:grid;
  gap:9px;
}

.choice{
  width:100%;

  padding:16px;

  text-align:left;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--panel);
  color:var(--text);

  transition:
    border-color .15s ease,
    background-color .15s ease,
    transform .12s ease;
}

.choice:active{
  transform:scale(.987);
}

.choice.selected{
  border-color:rgba(200,255,56,.55);
  background:rgba(200,255,56,.055);
}

.choice-title{
  font-size:13px;
  font-weight:850;
}

.choice-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}

.choice.selected::after{
  content:"✓";

  float:right;

  margin-top:-16px;

  color:var(--accent);

  font-weight:950;
}

.number-field{
  position:relative;
}

.number-field input{
  padding-right:62px;
}

.number-unit{
  position:absolute;

  right:14px;
  top:50%;

  transform:translateY(-50%);

  color:var(--muted);

  font-size:10px;
  font-weight:800;
}

.onboarding-footer{
  flex:none;

  display:flex;
  gap:9px;

  padding-top:18px;
}

.back-button{
  flex:none;

  width:51px;

  border:1px solid var(--line);
  border-radius:15px;

  background:var(--panel);
  color:var(--text);

  font-size:22px;
}

.next-button{
  flex:1;
}


/* ============================================================
   MAIN APP
   ============================================================ */

.app-shell{
  width:100%;
  max-width:1100px;

  min-height:100vh;

  margin:0 auto;

  padding-bottom:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom) +
      20px
    );
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  min-height:67px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(12px,env(safe-area-inset-top))
    18px
    12px;

  background:rgba(7,9,13,.94);

  border-bottom:1px solid rgba(255,255,255,.035);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.topbar-brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar-mark{
  width:32px;
  height:32px;

  border:1px solid var(--accent);
  border-radius:10px;

  position:relative;

  transform:rotate(-7deg);
}

.topbar-mark::before,
.topbar-mark::after{
  content:"";

  position:absolute;

  left:6px;
  right:6px;

  top:14px;

  height:3px;

  border-radius:10px;

  background:var(--accent);
}

.topbar-mark::before{
  transform:rotate(45deg);
}

.topbar-mark::after{
  transform:rotate(-45deg);
}

.topbar-title{
  font-size:13px;
  font-weight:950;

  letter-spacing:.14em;
}

.topbar-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;

  border:1px solid var(--line);
  border-radius:12px;

  background:var(--panel);
  color:var(--text);

  display:grid;
  place-items:center;
}

.avatar{
  width:38px;
  height:38px;

  border-radius:12px;

  display:grid;
  place-items:center;

  background:var(--accent);
  color:#111500;

  font-size:11px;
  font-weight:950;
}

.page{
  padding:22px 18px 0;

  animation:
    pageEnter .24s var(--ease) both;
}

@keyframes pageEnter{

  from{
    opacity:0;
    transform:translate3d(0,7px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}

.greeting{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:15px;

  margin-bottom:19px;
}

.greeting-kicker{
  color:var(--muted);

  font-size:10px;
  font-weight:800;

  letter-spacing:.13em;
  text-transform:uppercase;
}

.greeting h1{
  margin:4px 0 0;

  font-size:31px;
  line-height:1;

  letter-spacing:-.045em;
}

.date-text{
  color:var(--muted);

  font-size:10px;

  white-space:nowrap;
}


/* ============================================================
   CARDS
   ============================================================ */

.card{
  padding:18px;

  border:1px solid var(--line);
  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(20,25,33,.98),
      rgba(12,15,21,.98)
    );
}

.card + .card{
  margin-top:12px;
}

.card-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:14px;
}

.card-title{
  font-size:13px;
  font-weight:900;
}

.card-link{
  border:0;
  padding:3px 0;

  background:transparent;
  color:var(--accent);

  font-size:9px;
  font-weight:900;

  letter-spacing:.08em;
}

.hero-card{
  position:relative;

  overflow:hidden;

  border-color:rgba(200,255,56,.12);

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(200,255,56,.12),
      transparent 36%
    ),
    linear-gradient(
      145deg,
      #151b20,
      #0e1218
    );
}

.hero-label{
  color:var(--accent);

  font-size:9px;
  font-weight:950;

  letter-spacing:.15em;
}

.hero-card h2{
  margin:8px 0;

  font-size:27px;
  line-height:1.04;

  letter-spacing:-.045em;
}

.hero-card p{
  margin:0;

  max-width:560px;

  color:var(--muted);

  font-size:11px;
  line-height:1.55;
}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-top:17px;
}

.hero-stat{
  padding:10px;

  border:1px solid rgba(255,255,255,.05);
  border-radius:13px;

  background:rgba(0,0,0,.18);
}

.hero-stat strong{
  display:block;

  font-size:17px;
  font-weight:950;
}

.hero-stat span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:8px;
  font-weight:800;

  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:9px;
}

.stat-card{
  padding:14px;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--panel);
}

.stat-label{
  color:var(--muted);

  font-size:9px;
  font-weight:800;

  letter-spacing:.08em;
  text-transform:uppercase;
}

.stat-value{
  margin-top:5px;

  font-size:24px;
  font-weight:950;

  letter-spacing:-.04em;
}

.stat-unit{
  color:var(--muted);

  font-size:9px;
}


/* ============================================================
   RING
   ============================================================ */

.ring-card{
  display:flex;
  align-items:center;

  gap:18px;
}

.ring-wrap{
  width:110px;
  height:110px;

  flex:none;

  position:relative;
}

.ring{
  width:110px;
  height:110px;

  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;

  stroke:#20252d;

  stroke-width:8;
}

.ring-progress{
  fill:none;

  stroke:var(--accent);

  stroke-width:8;

  stroke-linecap:round;

  stroke-dasharray:301.59;
  stroke-dashoffset:301.59;

  transition:
    stroke-dashoffset .8s var(--ease);

  will-change:stroke-dashoffset;
}

.ring-center{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  text-align:center;
}

.ring-number{
  font-size:22px;
  line-height:1;

  font-weight:950;
}

.ring-label{
  margin-top:3px;

  color:var(--muted);

  font-size:8px;

  text-transform:uppercase;
}

.ring-info h3{
  margin:0 0 5px;

  font-size:17px;
}

.ring-info p{
  margin:0;

  color:var(--muted);

  font-size:10px;
  line-height:1.5;
}


/* ============================================================
   SECTION HEADINGS
   ============================================================ */

.section-heading{
  margin:24px 0 11px;

  color:var(--muted);

  font-size:10px;
  font-weight:900;

  letter-spacing:.13em;
  text-transform:uppercase;
}


/* ============================================================
   EXERCISES
   ============================================================ */

.exercise-list{
  display:grid;
  gap:8px;
}

.exercise{
  display:flex;
  align-items:center;

  gap:11px;

  padding:12px;

  border:1px solid var(--line);
  border-radius:15px;

  background:var(--panel);

  transition:
    opacity .18s ease,
    border-color .18s ease;
}

.exercise.done{
  opacity:.55;

  border-color:
    rgba(98,230,165,.2);
}

.exercise-check{
  width:35px;
  height:35px;

  flex:none;

  border:1px solid var(--line-strong);
  border-radius:11px;

  background:#0a0d12;
  color:transparent;

  display:grid;
  place-items:center;

  font-weight:950;

  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease;
}

.exercise.done .exercise-check{
  background:var(--success);
  border-color:var(--success);
  color:#07120c;
}

.exercise-main{
  min-width:0;
  flex:1;
}

.exercise-name{
  overflow:hidden;

  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
  font-weight:850;
}

.exercise-meta{
  margin-top:4px;

  color:var(--muted);

  font-size:9px;
}

.exercise-action{
  flex:none;

  border:0;
  padding:5px 0;

  background:transparent;
  color:var(--muted);

  font-size:9px;
  font-weight:850;
}


/* ============================================================
   TIMER
   ============================================================ */

.timer-card{
  padding:25px 18px;

  text-align:center;
}

.timer-label{
  color:var(--muted);

  font-size:9px;
  font-weight:900;

  letter-spacing:.14em;
}

.timer-value{
  margin:4px 0 17px;

  font-size:58px;
  font-weight:950;

  line-height:1;

  letter-spacing:-.06em;

  font-variant-numeric:tabular-nums;
}

.timer-controls{
  display:flex;
  justify-content:center;
  gap:8px;
}

.timer-controls button{
  width:48px;
  height:48px;

  border:1px solid var(--line);
  border-radius:14px;

  background:var(--panel-2);
  color:var(--text);

  font-weight:900;
}

.timer-controls .timer-main{
  background:var(--accent);
  border-color:var(--accent);
  color:#111500;
}


/* ============================================================
   NUTRITION
   ============================================================ */

.macro-row{
  display:grid;
  gap:13px;
}

.macro{
  display:grid;
  gap:7px;
}

.macro-top{
  display:flex;
  justify-content:space-between;

  font-size:10px;
}

.macro-top span:first-child{
  font-weight:850;
}

.macro-top span:last-child{
  color:var(--muted);
}

.macro-track{
  height:7px;

  overflow:hidden;

  border-radius:100px;

  background:#20242b;
}

.macro-fill{
  height:100%;
  width:0;

  border-radius:inherit;

  background:var(--accent);

  transition:
    width .65s var(--ease);
}

.meal-list{
  display:grid;
  gap:8px;
}

.meal{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:12px;

  border:1px solid var(--line);
  border-radius:15px;

  background:var(--panel);
}

.meal-info{
  min-width:0;
}

.meal-info strong{
  font-size:11px;
}

.meal-info p{
  overflow:hidden;

  margin:4px 0 0;

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;
  text-overflow:ellipsis;
}

.meal-right{
  flex:none;

  text-align:right;
}

.meal-cal{
  color:var(--muted);

  font-size:9px;
}


/* ============================================================
   PROGRESS
   ============================================================ */

.chart{
  height:170px;

  overflow:hidden;

  border-radius:15px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:100% 25%;
}

.chart svg{
  display:block;

  width:100%;
  height:100%;
}

.chart-empty{
  height:100%;

  display:grid;
  place-items:center;

  padding:30px;

  color:var(--muted);

  font-size:10px;
  line-height:1.55;

  text-align:center;
}

.history{
  display:grid;
  gap:8px;
}

.history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:12px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--panel);
}

.history-item strong{
  font-size:11px;
}

.history-item small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:9px;
}

.history-date{
  color:var(--muted);

  font-size:9px;
}


/* ============================================================
   PROFILE
   ============================================================ */

.profile-head{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:19px;
}

.profile-avatar{
  width:62px;
  height:62px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:19px;

  background:var(--accent);
  color:#101400;

  font-size:20px;
  font-weight:950;
}

.profile-head h2{
  margin:0 0 4px;

  font-size:21px;
}

.profile-head p{
  margin:0;

  color:var(--muted);

  font-size:10px;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:8px;
}

.profile-item{
  padding:11px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--panel);
}

.profile-item small{
  display:block;

  color:var(--muted);

  font-size:8px;

  text-transform:uppercase;
  letter-spacing:.08em;
}

.profile-item strong{
  display:block;

  margin-top:5px;

  font-size:11px;
}


/* ============================================================
   BADGES
   ============================================================ */

.badge{
  display:inline-flex;
  align-items:center;

  padding:5px 8px;

  border:1px solid var(--line);
  border-radius:100px;

  color:var(--muted);

  font-size:8px;
  font-weight:850;

  white-space:nowrap;
}

.badge.accent{
  border-color:rgba(200,255,56,.18);

  background:rgba(200,255,56,.05);

  color:var(--accent);
}

.badge.success{
  border-color:rgba(98,230,165,.18);

  color:var(--success);
}


/* ============================================================
   BOTTOM NAV
   ============================================================ */

.bottom-nav{
  position:fixed;

  left:50%;
  bottom:0;

  z-index:100;

  width:min(100%,700px);

  transform:translateX(-50%);

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:
    7px
    9px
    calc(7px + env(safe-area-inset-bottom));

  background:rgba(8,10,14,.96);

  border:1px solid var(--line);
  border-bottom:0;

  border-radius:20px 20px 0 0;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.nav-btn{
  min-height:56px;

  border:0;
  border-radius:13px;

  background:transparent;
  color:var(--muted);

  font-size:8px;
  font-weight:850;

  transition:
    color .16s ease,
    background-color .16s ease;
}

.nav-icon{
  display:block;

  margin-bottom:4px;

  font-size:17px;
  line-height:1;

  transition:
    transform .16s var(--ease);
}

.nav-btn.active{
  color:var(--accent);

  background:rgba(200,255,56,.035);
}

.nav-btn.active .nav-icon{
  transform:translateY(-1px);
}


/* ============================================================
   CHAT
   ============================================================ */

.chat-fab{
  position:fixed;

  right:16px;
  bottom:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom) +
      13px
    );

  z-index:90;

  width:53px;
  height:53px;

  border:1px solid rgba(200,255,56,.18);
  border-radius:17px;

  background:var(--accent);
  color:#111500;

  font-size:20px;
  font-weight:950;

  box-shadow:0 12px 30px rgba(0,0,0,.28);

  transition:transform .14s ease;
}

.chat-fab:active{
  transform:scale(.93);
}

.chat-panel{
  position:fixed;

  inset:0;

  z-index:300;

  display:flex;
  flex-direction:column;

  background:#07090d;

  animation:
    chatEnter .25s var(--ease) both;
}

@keyframes chatEnter{

  from{
    opacity:0;
    transform:translate3d(0,18px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}

.chat-header{
  flex:none;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(13px,env(safe-area-inset-top))
    16px
    13px;

  border-bottom:1px solid var(--line);

  background:#080b0f;
}

.chat-brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-mark{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--accent);
  color:#101400;

  font-weight:950;
}

.chat-brand strong{
  display:block;

  font-size:12px;
}

.chat-brand span{
  display:block;

  margin-top:3px;

  color:var(--success);

  font-size:8px;
  font-weight:800;
}

.chat-close{
  width:38px;
  height:38px;

  border:1px solid var(--line);
  border-radius:12px;

  background:var(--panel);
  color:var(--text);
}

.chat-messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:17px 15px 18px;

  display:flex;
  flex-direction:column;

  gap:9px;

  overscroll-behavior:contain;
}

.message{
  max-width:86%;

  padding:11px 13px;

  border-radius:16px;

  font-size:11px;
  line-height:1.55;

  animation:
    messageEnter .2s var(--ease) both;
}

@keyframes messageEnter{

  from{
    opacity:0;
    transform:translate3d(0,6px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}

.message.bot{
  align-self:flex-start;

  border:1px solid var(--line);
  border-top-left-radius:5px;

  background:var(--panel);
}

.message.user{
  align-self:flex-end;

  border-top-right-radius:5px;

  background:var(--accent);
  color:#111500;

  font-weight:650;
}

.typing{
  display:flex;
  align-items:center;
  gap:4px;
}

.typing-dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--muted);

  animation:
    typingPulse .8s infinite;
}

.typing-dot:nth-child(2){
  animation-delay:.12s;
}

.typing-dot:nth-child(3){
  animation-delay:.24s;
}

@keyframes typingPulse{

  0%,
  100%{
    opacity:.25;
    transform:translateY(0);
  }

  50%{
    opacity:1;
    transform:translateY(-3px);
  }

}

.chat-suggestions{
  flex:none;

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding:
    8px 14px 5px;

  scrollbar-width:none;
}

.chat-suggestions::-webkit-scrollbar{
  display:none;
}

.suggestion{
  flex:none;

  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:100px;

  background:var(--panel);
  color:var(--text-soft);

  font-size:9px;

  white-space:nowrap;
}

.chat-input{
  flex:none;

  display:flex;
  gap:8px;

  padding:
    9px 11px
    calc(9px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:#090c11;
}

.chat-input input{
  flex:1;
  min-width:0;

  min-height:46px;

  padding:11px 12px;

  border:1px solid var(--line);
  border-radius:14px;

  outline:none;

  background:var(--panel);
  color:var(--text);
}

.chat-send{
  width:46px;

  border:0;
  border-radius:14px;

  background:var(--accent);
  color:#111500;

  font-weight:950;
}


/* ============================================================
   MODAL
   ============================================================ */

.modal-layer{
  position:fixed;

  inset:0;

  z-index:500;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.64);

  animation:
    fadeIn .16s ease both;
}

@keyframes fadeIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

.modal{
  width:min(100%,550px);

  max-height:90vh;

  overflow:auto;

  padding:19px;

  border:1px solid var(--line-strong);
  border-radius:24px;

  background:var(--panel);

  animation:
    modalEnter .22s var(--ease) both;
}

@keyframes modalEnter{

  from{
    opacity:0;
    transform:translate3d(0,20px,0);
  }

  to{
    opacity:1;
    transform:translate3d(0,0,0);
  }

}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:17px;
}

.modal-head h3{
  margin:0;

  font-size:17px;
}

.modal-close{
  width:36px;
  height:36px;

  border:1px solid var(--line);
  border-radius:11px;

  background:var(--panel-2);
  color:var(--text);
}


/* ============================================================
   TOAST
   ============================================================ */

.toast{
  position:fixed;

  left:50%;
  bottom:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom) +
      16px
    );

  z-index:1000;

  max-width:calc(100% - 30px);

  padding:10px 14px;

  border-radius:13px;

  background:#eaf6d0;
  color:#111600;

  font-size:10px;
  font-weight:850;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transform:translate3d(-50%,10px,0);

  transition:
    opacity .2s ease,
    transform .2s var(--ease);
}

.toast.show{
  opacity:1;

  transform:translate3d(-50%,0,0);
}


/* ============================================================
   SKELETON
   ============================================================ */

.skeleton{
  background:
    linear-gradient(
      90deg,
      #11151b 25%,
      #1b2028 37%,
      #11151b 63%
    );

  background-size:400% 100%;

  animation:
    skeletonMove 1.25s linear infinite;

  border-radius:12px;
}

@keyframes skeletonMove{

  from{
    background-position:100% 0;
  }

  to{
    background-position:-100% 0;
  }

}


/* ============================================================
   CHECK-IN
   ============================================================ */

.scale-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);

  gap:6px;
}

.scale-btn{
  height:41px;

  border:1px solid var(--line);
  border-radius:11px;

  background:var(--panel-2);
  color:var(--muted);

  font-weight:900;
}

.scale-btn.active{
  border-color:var(--accent);

  background:var(--accent);
  color:#101400;
}


/* ============================================================
   DESKTOP
   ============================================================ */

@media(min-width:700px){

  .page{
    padding-left:28px;
    padding-right:28px;
  }

  .dashboard-grid{
    display:grid;

    grid-template-columns:
      minmax(0,1.2fr)
      minmax(320px,.8fr);

    gap:12px;

    align-items:start;
  }

  .dashboard-grid > .card{
    margin:0;
  }

  .stats-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bottom-nav{
    bottom:15px;

    border:1px solid var(--line);
    border-radius:20px;
  }

  .chat-fab{
    bottom:88px;
  }

}


/* ============================================================
   LARGE DESKTOP
   ============================================================ */

@media(min-width:950px){

  .page{
    padding-top:30px;
  }

  .app-shell{
    padding-bottom:100px;
  }

}


/* ============================================================
   MOBILE KEYBOARD SAFETY
   ------------------------------------------------------------
   Prevent browser from trying to animate/reposition the entire
   page when the keyboard appears.
   ============================================================ */

@media(max-width:699px){

  body{
    min-height:100svh;
  }

  .auth-screen{
    min-height:100svh;
  }

  .onboarding-screen{
    min-height:100svh;
  }

}


/* ============================================================
   FOCUS
   ============================================================ */

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

::selection{
  background:var(--accent);
  color:#111500;
}

<body>


<!-- ==========================================================
     SPLASH
     ========================================================== -->

<div id="splash">

  <div class="splash-content">

    <div class="logo-mark">
      <span class="logo-dot"></span>
    </div>

    <div class="brand">
      FITFORM
    </div>

    <div class="splash-subtitle">
      PERSONALIZED FITNESS SYSTEM
    </div>

  </div>

</div>


<!-- ==========================================================
     APPLICATION ROOT
     ========================================================== -->

<div id="app"></div>


<!-- ==========================================================
     TOAST
     ========================================================== -->

<div id="toast" class="toast"></div>


<script>

/* ============================================================
   FITFORM APPLICATION
   ============================================================ */

"use strict";


/* ============================================================
   STORAGE
   ============================================================ */

const STORAGE = {

  accounts:"fitform_accounts_perf",

  session:"fitform_session_perf",

  profile:"fitform_profile_perf",

  plan:"fitform_plan_perf",

  progress:"fitform_progress_perf",

  meals:"fitform_meals_perf",

  chat:"fitform_chat_perf",

  onboarding:"fitform_onboarding_perf"

};


/* ============================================================
   APPLICATION STATE
   ============================================================ */

const state = {

  screen:"loading",

  authMode:"login",

  onboardingStep:0,

  onboardingData:{},

  onboardingDirection:1,

  activePage:"home",

  currentWorkout:null,

  timer:0,

  timerRunning:false,

  timerInterval:null,

  renderLock:false,

  chatOpen:false,

  checkin:{},

  toastTimer:null,

  animationFrame:null

};


/* ============================================================
   SAFE STORAGE
   ============================================================ */

function read(key,fallback){

  try{

    const raw=localStorage.getItem(key);

    if(raw===null){
      return fallback;
    }

    return JSON.parse(raw);

  }catch(error){

    return fallback;

  }

}


function write(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.warn(
      "FITFORM storage error",
      error
    );

  }

}


function remove(key){

  try{

    localStorage.removeItem(key);

  }catch(error){}

}


function getAccounts(){

  return read(
    STORAGE.accounts,
    []
  );

}


function getSession(){

  return read(
    STORAGE.session,
    null
  );

}


function getProfile(){

  return read(
    STORAGE.profile,
    null
  );

}


function getPlan(){

  return read(
    STORAGE.plan,
    null
  );

}


function getProgress(){

  return read(
    STORAGE.progress,
    {
      weights:[],
      workouts:[],
      checkins:[],
      currentStreak:0,
      bestStreak:0,
      todaySteps:0
    }
  );

}


function getMeals(){

  return read(
    STORAGE.meals,
    {}
  );

}


function getChatHistory(){

  return read(
    STORAGE.chat,
    []
  );

}


/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function round(value,digits=0){

  const power=Math.pow(
    10,
    digits
  );

  return Math.round(
    value*power
  )/power;

}


function clamp(value,min,max){

  return Math.min(
    max,
    Math.max(min,value)
  );

}


function todayKey(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function formatDate(date){

  return new Intl.DateTimeFormat(
    "en-IN",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  ).format(date);

}


function shortDate(date){

  return new Intl.DateTimeFormat(
    "en-IN",
    {
      day:"numeric",
      month:"short"
    }
  ).format(date);

}


function initials(name){

  return String(name||"F")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}


function pretty(value){

  if(value===undefined || value===null){
    return "Not set";
  }

  return String(value)
    .replaceAll("_"," ")
    .replace(
      /\b\w/g,
      char=>char.toUpperCase()
    );

}


function vibrate(ms=12){

  if(
    "vibrate" in navigator &&
    typeof navigator.vibrate==="function"
  ){

    navigator.vibrate(ms);

  }

}


/* ============================================================
   TOAST
   ============================================================ */

function toast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(
    state.toastTimer
  );

  state.toastTimer=setTimeout(()=>{

    el.classList.remove("show");

  },2400);

}


/* ============================================================
   AUTH QUESTION DATA
   ============================================================ */

const QUESTIONS=[

  {
    id:"name",
    kicker:"01 · Identity",
    title:"What should we call you?",
    description:"Your FITFORM system will use this name throughout the app.",
    type:"text",
    placeholder:"e.g. Ayan"
  },

  {
    id:"age",
    kicker:"02 · Body profile",
    title:"How old are you?",
    description:"Age affects how fitness estimates should be interpreted.",
    type:"number",
    unit:"years",
    min:13,
    max:100
  },

  {

/* ============================================================
   AUTH EVENT BINDING
   ============================================================ */

function bindAuthEvents(){

  const form=document.getElementById("authForm");

  const tabs=document.querySelectorAll(
    "[data-auth-tab]"
  );

  tabs.forEach(tab=>{

    tab.addEventListener(
      "click",
      ()=>{

        switchAuth(
          tab.dataset.authTab
        );

      },
      {passive:true}
    );

  });


  const forgot=document.getElementById(
    "forgotButton"
  );

  if(forgot){

    forgot.addEventListener(
      "click",
      ()=>{

        if(state.authMode==="forgot"){
          switchAuth("login");
        }else{
          switchAuth("forgot");
        }

      }
    );

  }


  const guest=document.getElementById(
    "guestButton"
  );

  if(guest){

    guest.addEventListener(
      "click",
      guestLogin
    );

  }


  const passwordToggle=document.getElementById(
    "passwordToggle"
  );

  if(passwordToggle){

    passwordToggle.addEventListener(
      "click",
      ()=>{

        const input=
          document.getElementById(
            "authPassword"
          );

        if(!input)return;

        input.type=
          input.type==="password"
            ?"text"
            :"password";

      }
    );

  }


  if(form){

    form.addEventListener(
      "submit",
      handleAuthSubmit
    );

  }

}


/* ============================================================
   AUTH MODE
   ============================================================ */

function switchAuth(mode){

  state.authMode=mode;

  renderAuth();

}


/* ============================================================
   AUTH SUBMIT
   ============================================================ */

function handleAuthSubmit(event){

  event.preventDefault();

  const mode=state.authMode;

  const emailInput=
    document.getElementById(
      "authEmail"
    );

  const passwordInput=
    document.getElementById(
      "authPassword"
    );

  if(!emailInput || !passwordInput){
    return;
  }

  const email=
    emailInput.value
      .trim()
      .toLowerCase();

  const password=
    passwordInput.value;

  if(!email || !password){

    toast("Enter your email and password.");

    return;

  }


  const accounts=getAccounts();


  /* LOGIN */

  if(mode==="login"){

    const account=
      accounts.find(
        item=>
          item.email===email &&
          item.password===password
      );

    if(!account){

      toast("Invalid email or password.");

      return;

    }


    write(
      STORAGE.session,
      {
        email:account.email,
        name:account.name,
        guest:false,
        loginAt:Date.now()
      }
    );


    enterApp();

    return;

  }


  /* CREATE */

  if(mode==="create"){

    const nameInput=
      document.getElementById(
        "authName"
      );

    const confirmInput=
      document.getElementById(
        "authConfirm"
      );

    const name=
      nameInput
        ? nameInput.value.trim()
        : "FITFORM User";

    const confirm=
      confirmInput
        ? confirmInput.value
        : "";


    if(password!==confirm){

      toast("Passwords do not match.");

      return;

    }


    if(
      accounts.some(
        item=>item.email===email
      )
    ){

      toast(
        "An account with this email already exists."
      );

      return;

    }


    const account={

      id:
        "u_"+Date.now(),

      name:
        name || "FITFORM User",

      email,

      password,

      createdAt:
        Date.now()

    };


    accounts.push(account);

    write(
      STORAGE.accounts,
      accounts
    );


    write(
      STORAGE.session,
      {
        email:account.email,
        name:account.name,
        guest:false,
        loginAt:Date.now()
      }
    );


    remove(STORAGE.profile);
    remove(STORAGE.plan);

    state.onboardingData={
      name:account.name
    };

    state.onboardingStep=0;

    renderOnboarding();

    return;

  }


  /* FORGOT PASSWORD */

  if(mode==="forgot"){

    const confirmInput=
      document.getElementById(
        "authConfirm"
      );

    const confirm=
      confirmInput
        ? confirmInput.value
        : "";


    if(password!==confirm){

      toast("Passwords do not match.");

      return;

    }


    const index=
      accounts.findIndex(
        item=>item.email===email
      );


    if(index===-1){

      toast(
        "No local account found for this email."
      );

      return;

    }


    accounts[index].password=
      password;

    write(
      STORAGE.accounts,
      accounts
    );


    toast(
      "Password reset locally."
    );


    switchAuth("login");

  }

}

/* ============================================================

   ============================================================ */

function bindOnboardingShell(){

  const next=
    document.getElementById(
      "onboardingNext"
    );

  const back=
    document.getElementById(
      "onboardingBack"
    );


  if(next){

    next.addEventListener(
      "click",
      handleNextQuestion
    );

  }


  if(back){

    back.addEventListener(
      "click",
      handlePreviousQuestion
    );

  }


  const viewport=
    document.getElementById(
      "questionViewport"
    );


  /*
    Prevent accidental scroll chaining.
    This matters on mobile when the keyboard is open.
  */

  if(viewport){

    viewport.addEventListener(
      "touchmove",
      event=>{

        /*
          We intentionally don't preventDefault.
          We simply keep the viewport isolated through CSS.
        */

      },
      {passive:true}
    );

  }

}

/* ============================================================
   QUESTION HTML
   ============================================================ */

function getQuestionHTML(question){

  const data=
    state.onboardingData;

  const value=
    data[question.id];


  /* TEXT */

  if(question.type==="text"){

    return `

      <div class="field">

        <label>
          Your name
        </label>

        <input
          id="questionInput"
          type="text"
          value="${escapeHTML(value||"")}"
          placeholder="${escapeHTML(question.placeholder||"")}"
          autocomplete="name"
        >

      </div>

    `;

  }


  /* NUMBER */

  if(question.type==="number"){

    return `

      <div class="field">

        <label>
          ${escapeHTML(question.unit)}
        </label>

        <div class="number-field">

          <input
            id="questionInput"
            type="number"
            inputmode="decimal"
            min="${question.min}"
            max="${question.max}"
            value="${
              value!==undefined
                ? escapeHTML(value)
                :""
            }"
            placeholder="Enter value"
          >

          <span class="number-unit">
            ${escapeHTML(question.unit)}
          </span>

        </div>

      </div>

    `;

  }


  /* CHOICES */

  if(question.type==="choices"){

    return `

      <div class="choice-grid">

        ${question.options
          .map(option=>`

            <button
              type="button"
              class="choice ${
                value===option[0]
                  ?"selected"
                  :""
              }"
              data-choice-value="${escapeHTML(option[0])}"
            >

              <div class="choice-title">
                ${escapeHTML(option[1])}
              </div>

              ${
                option[2]
                ?`
                  <div class="choice-sub">
                    ${escapeHTML(option[2])}
                  </div>
                `
                :""
              }

            </button>

          `)
          .join("")}

      </div>

    `;

  }


  /* DYNAMIC GOAL */

  if(question.type==="dynamicGoal"){

    const options=
      getGoalOptions(
        data.goal
      );


    return `

      <div class="choice-grid">

        ${options
          .map(option=>`

            <button
              type="button"
              class="choice ${
                value===option[0]
                  ?"selected"
                  :""
              }"
              data-choice-value="${escapeHTML(option[0])}"
            >

              <div class="choice-title">
                ${escapeHTML(option[1])}
              </div>

              <div class="choice-sub">
                ${escapeHTML(option[2])}
              </div>

            </button>

          `)
          .join("")}

      </div>

    `;

  }


  return "";

}

      "onboardingBack"
    );


  if(
    !question ||
    !content
  ){
    return;
  }


  /*
    Disable transition for the old DOM update.
    Then force only one animation frame.
  */

  content.style.animation="none";

  content.innerHTML=`

    <div class="question-kicker">
      ${escapeHTML(question.kicker)}
    </div>

    <h1 class="question-title">
      ${escapeHTML(question.title)}
    </h1>

    <p class="question-description">
      ${escapeHTML(question.description)}
    </p>

    ${getQuestionHTML(question)}

  `;


  /*
    Re-enable animation after the DOM has settled.
    requestAnimationFrame prevents style mutation from
    happening in the same layout phase.
  */

  if(animate){

    requestAnimationFrame(()=>{

      content.style.animation=
        "questionEnter .25s var(--ease) both";

    });

  }else{

    content.style.animation="none";

  }


  /* Counter */

  if(counter){

    counter.textContent=
      `${state.onboardingStep+1} / ${QUESTIONS.length}`;

  }


  /* Progress */

  if(progress){

    const percent=
      state.onboardingStep /
      (QUESTIONS.length-1);

    progress.style.transform=
      `scaleX(${percent})`;

  }


  /* Back button */

  if(back){

    back.style.visibility=
      state.onboardingStep===0
        ?"hidden"
        :"visible";

    back.style.pointerEvents=
      state.onboardingStep===0
        ?"none"
        :"auto";

  }


  /* Next label */

  if(next){

    next.textContent=
      state.onboardingStep===
      QUESTIONS.length-1

      ? "BUILD MY FITFORM PLAN"

      : "CONTINUE";

  }


  bindQuestionEvents();

}


/* ============================================================
   QUESTION EVENTS
   ============================================================ */

function bindQuestionEvents(){

  const content=
    document.getElementById(
      "questionContent"
    );

  if(!content)return;


  const choices=
    content.querySelectorAll(
      "[data-choice-value]"
    );


  choices.forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const value=
          button.dataset.choiceValue;

        state.onboardingData[
          QUESTIONS[
            state.onboardingStep
          ].id
        ]=value;


        /*
          We don't need to rerender the whole shell.
          Only update selected visual state.
        */

        choices.forEach(item=>{

          item.classList.toggle(
            "selected",
            item===button
          );

        });


        write(
          STORAGE.onboarding,
          state.onboardingData
        );


        vibrate(8);

      },
      {passive:true}
    );

  });


  const input=
    document.getElementById(
      "questionInput"
    );


  if(input){

    input.addEventListener(
      "input",
      ()=>{

        const question=
          QUESTIONS[
            state.onboardingStep
          ];

        let value=
          input.value;


        if(
          question.type==="number"
        ){

          value=
            value===""
              ?""
              :Number(value);

        }


        state.onboardingData[
          question.id
        ]=value;


        /*
          Saving on input keeps progress safe,
          but localStorage writes can be expensive.
          Therefore debounce them.
        */

        scheduleOnboardingSave();

      }
    );


    /*
      Autofocus ONLY when appropriate.
      We do not scroll into view.
      This is one of the major fixes for keyboard jumps.
    */

    if(
      questionAllowsAutoFocus()
    ){

      requestAnimationFrame(()=>{

        try{

          input.focus({
            preventScroll:true
          });

        }catch(error){

          input.focus();

        }

      });

    }

  }

}


/* ============================================================
   AUTO FOCUS RULE
   ============================================================ */

function questionAllowsAutoFocus(){

  const question=
    QUESTIONS[
      state.onboardingStep
    ];

  if(!question)return false;

  /*
    Autofocus text/number fields only.
    Never autofocus choice questions.
  */

  return(
    question.type==="text" ||
    question.type==="number"
  );

}


/* ============================================================
   DEBOUNCED ONBOARDING SAVE
   ============================================================ */

let onboardingSaveTimer=null;

function scheduleOnboardingSave(){

  clearTimeout(
    onboardingSaveTimer
  );

  onboardingSaveTimer=
    setTimeout(()=>{

      write(
        STORAGE.onboarding,
        state.onboardingData
      );

    },220);

}


/* ============================================================
   QUESTION VALIDATION
   ============================================================ */

function validateCurrentQuestion(){

  const question=
    QUESTIONS[
      state.onboardingStep
    ];

  if(!question){
    return false;
  }


  if(
    question.type==="choices" ||
    question.type==="dynamicGoal"
  ){

    if(
      !state.onboardingData[
        question.id
      ]
    ){

      toast(
        "Choose an option to continue."
      );

      return false;

    }

    return true;

  }


  const input=
    document.getElementById(
      "questionInput"
    );

  if(!input){

    return false;

  }


  const raw=
    input.value.trim();


  if(!raw){

    toast(
      "Please enter a value."
    );

    try{

      input.focus({
        preventScroll:true
      });

    }catch(error){

      input.focus();

    }

    return false;

  }


  if(question.type==="number"){

    const number=
      Number(raw);


    if(
      !Number.isFinite(number) ||
      number<question.min ||
      number>question.max
    ){

      toast(
        `Enter a value between ${question.min} and ${question.max}.`
      );

      return false;

    }


    state.onboardingData[
      question.id
    ]=number;

  }else{

    state.onboardingData[
      question.id
    ]=raw;

  }


  write(
    STORAGE.onboarding,
    state.onboardingData
  );


  return true;

}


/* ============================================================
   NEXT QUESTION
   ============================================================ */

function handleNextQuestion(){

  if(state.renderLock){
    return;
  }


  if(
    !validateCurrentQuestion()
  ){

    return;

  }


  state.renderLock=true;

  state.onboardingDirection=1;

  vibrate(10);


  if(
    state.onboardingStep<
    QUESTIONS.length-1
  ){

    state.onboardingStep++;

    write(
      STORAGE.onboarding,
      state.onboardingData
    );


    /*
      Use rAF so click event/layout work completes
      before the question is swapped.
    */

    requestAnimationFrame(()=>{

      updateOnboardingQuestion(true);

      state.renderLock=false;

    });

  }else{

    state.renderLock=false;

    finishOnboarding();

  }

}


/* ============================================================
   PREVIOUS QUESTION
   ============================================================ */

function handlePreviousQuestion(){

  if(state.renderLock){
    return;
  }


  if(
    state.onboardingStep<=0
  ){

    return;

  }


  state.renderLock=true;

  state.onboardingDirection=-1;

  state.onboardingStep--;


  requestAnimationFrame(()=>{

    updateOnboardingQuestion(true);

    state.renderLock=false;

  });

}


/* ============================================================
   FITNESS CALCULATIONS
   ============================================================ */

function calculateBMR(profile){

  const age=
    Number(profile.age);

  const weight=
    Number(profile.weight);

  const height=
    Number(profile.height);


  if(
    profile.sex==="male"
  ){

    return(
      10*weight+
      6.25*height-
      5*age+
      5
    );

  }


  if(
    profile.sex==="female"
  ){

    return(
      10*weight+
      6.25*height-
      5*age-
      161
    );

  }


  /*
    Approximate neutral estimate.
    Clearly not a medical measurement.
  */

  return(
    10*weight+
    6.25*height-
    5*age-
    78
  );

}


function activityMultiplier(activity){

  const map={

    sedentary:1.20,

    light:1.35,

    moderate:1.50,

    very:1.70

  };


  return(
    map[activity]||
    1.35
  );

}


function calculateTDEE(profile){

  return(
    calculateBMR(profile)*
    activityMultiplier(
      profile.activity
    )
  );

}


function calculateBMI(profile){

  const height=
    Number(profile.height)/
    100;

  const weight=
    Number(profile.weight);


  if(!height){
    return 0;
  }


  return(
    weight/
    (height*height)
  );

}


function bmiCategory(bmi){

  if(bmi<18.5){
    return "Below typical range";
  }

  if(bmi<25){
    return "Typical range";
  }

  if(bmi<30){
    return "Above typical range";
  }

  return "High range";

}


function calculateCalories(profile){

  const tdee=
    calculateTDEE(profile);


  /*
    No restrictive calorie target for minors.
  */

  if(
    Number(profile.age)<18
  ){

    return{
      calories:Math.round(tdee),
      mode:"maintenance_guidance"
    };

  }


  let calories=tdee;


  if(
    profile.goal==="lose_fat"
  ){

    const deficit=
      profile.approach==="moderate"
        ? .15
        : .10;

    calories=
      tdee*(1-deficit);

  }


  if(
    profile.goal==="build_muscle"
  ){

    calories=
      tdee*
      (
        profile.approach==="hypertrophy"
          ?1.08
          :1.05
      );

  }


  if(
    profile.goal==="gain_weight"
  ){

    calories=
      tdee*
      (
        profile.approach==="general"
          ?1.10
          :1.07
      );

  }


  if(
    profile.goal==="get_stronger"
  ){

    calories=
      tdee*1.03;

  }


  return{

    calories:
      Math.round(calories),

    mode:"estimate"

  };

}


function calculateProtein(profile){

  const weight=
    Number(profile.weight);


  let factor=1.5;


  if(
    profile.goal==="lose_fat"
  ){

    factor=1.7;

  }


  if(
    profile.goal==="build_muscle"
  ){

    factor=1.8;

  }


  if(
    profile.goal==="gain_weight"
  ){

    factor=1.6;

  }


  if(
    profile.goal==="get_stronger"
  ){

    factor=1.7;

  }


  if(
    profile.goal==="health"
  ){

    factor=1.4;

  }


  if(
    Number(profile.age)<18
  ){

    factor=1.3;

  }


  return Math.round(
    weight*factor
  );

}


function calculateSteps(profile){

  const current=
    Number(profile.steps)||4000;


  let target=current;


  if(
    profile.activity==="sedentary"
  ){

    target=
      Math.max(
        6000,
        current+1500
      );

  }


  if(
    profile.activity==="light"
  ){

    target=
      Math.max(
        7000,
        current+1000
      );

  }


  if(
    profile.activity==="moderate"
  ){

    target=
      Math.max(
        8000,
        current+500
      );

  }


  if(
    profile.activity==="very"
  ){

    target=
      Math.max(
        9000,
        current
      );

  }


  if(
    profile.goal==="lose_fat"
  ){

    target=
      Math.max(
        target,
        8000
      );

  }


  return clamp(
    Math.round(target/500)*500,
    0,
    12000
  );

}

/* ============================================================
   CLONE EXERCISE
   ============================================================ */

function createExercise(
  key,
  experience
){

  const base=
    EXERCISES[key];

  if(!base){
    return null;
  }


  const exercise={
    ...base,
    key,
    id:
      key+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,7),
    done:false
  };


  if(
    experience==="beginner"
  ){

    exercise.sets=
      Math.max(
        2,
        exercise.sets-1
      );

  }


  if(
    experience==="advanced"
  ){

    if(
      exercise.sets<4
    ){

      exercise.sets++;

    }

  }


  return exercise;

}

   ============================================================ */

function makeWorkout(
  name,
  profile,
  keys
){

  return{

    name,

    duration:
      profile.duration,

    focus:name,

    exercises:
      keys
        .map(
          key=>
            createExercise(
              key,
              profile.experience
            )
        )
        .filter(Boolean)

  };

}


function generateWorkouts(profile){

  const e=
    getEquipmentMap(
      profile
    );

  const days=
    Number(
      profile.trainingDays
    );


  if(days===2){

    return [

      makeWorkout(
        "Full Body A",
        profile,
        [
          e.push[0],
          e.pull[0],
          e.legs[0],
          e.legs[1],
          e.push[1]||e.push[0],
          e.legs[4]||e.legs[3]
        ]
      ),

      makeWorkout(
        "Full Body B",
        profile,
        [
          e.push[1]||e.push[0],
          e.pull[1]||e.pull[0],
          e.legs[1]||e.legs[0],
          e.legs[2]||e.legs[1],
          e.pull[2]||e.pull[0],
          e.legs[5]||e.legs[4]

      )

  if(days===3){

    return [

      makeWorkout(

          e.legs[0],
          e.push[2]||e.push[1],

/* ============================================================
   MEAL GENERATOR
   ============================================================ */

function generateMeals(
  profile,
  calories,
  protein
){

  const count=
    profile.meals==="2"
      ?2
      :profile.meals==="3"
      ?3
      :profile.meals==="4"
      ?4
      :5;


  const foodPool=
    FOODS[
      profile.diet
    ] ||
    FOODS.vegetarian;


  const names=[
    "Meal 1",
    "Meal 2",
    "Meal 3",
    "Meal 4",
    "Meal 5"
  ];


  const distributions=
    count===2
      ?[.45,.55]
      :count===3
      ?[.30,.35,.35]
      :count===4
      ?[.25,.25,.25,.25]
      :[.20,.20,.20,.20,.20];


  return Array.from(
    {
      length:count
    },
    (_,index)=>{

      const start=
        (index*3)%
        foodPool.length;


      const selected=[

        foodPool[
          start
        ],

        foodPool[
          (start+1)%
          foodPool.length
        ],

        foodPool[
          (start+2)%
          foodPool.length
        ]

      ];


      return{

        name:
          names[index],

        calories:
          Math.round(
            calories*
            distributions[index]
          ),

        protein:
          Math.round(
            protein*
            distributions[index]
          ),

        foods:selected

      };

    }
  );

}


/* ============================================================
   PLAN GENERATION
   ============================================================ */

function generatePlan(profile){

  const bmr=
    Math.round(
      calculateBMR(profile)
    );

  const tdee=
    Math.round(
      calculateTDEE(profile)
    );

  const calorieData=
    calculateCalories(profile);

  const protein=
    calculateProtein(profile);

  const steps=
    calculateSteps(profile);

  const bmi=
    round(
      calculateBMI(profile),
      1
    );


  return{

    createdAt:
      Date.now(),

    bmr,

    tdee,

    calories:
      calorieData.calories,

    calorieMode:
      calorieData.mode,

    protein,

    steps,

    bmi,

    bmiCategory:
      bmiCategory(bmi),

    workouts:
      generateWorkouts(profile),

    meals:
      generateMeals(
        profile,
        calorieData.calories,
        protein
      ),

    nutritionNote:
      getNutritionNote(profile),

    progression:{
      rule:
        profile.goal==="get_stronger"

          ? "When you can complete the prescribed reps with clean form, increase the load slightly next session."

          : "When you can consistently reach the top of the rep range with clean form, add a small amount of load or an additional rep."
    }

  };

}


/* ============================================================
   NUTRITION NOTE
   ============================================================ */

function getNutritionNote(profile){

  if(
    Number(profile.age)<18
  ){

    return(
      "Because you are under 18, FITFORM does not prescribe restrictive calorie targets. Focus on regular meals, protein-rich foods, fruits, vegetables, hydration and adequate sleep, with guidance from a parent or qualified professional."
    );

  }


  if(
    profile.goal==="lose_fat"
  ){

    return(
      "Use a moderate calorie deficit, prioritize protein, eat filling foods and keep resistance training consistent."
    );

  }


  if(
    profile.goal==="build_muscle" ||
    profile.goal==="gain_weight"
  ){

    return(
      "Prioritize protein, carbohydrate-rich training fuel and a small calorie surplus. Increase food gradually if weight is not moving."
    );

  }


  return(
    "Build meals around protein, minimally processed carbohydrate sources, vegetables or fruit, and enough dietary fat for a sustainable routine."
  );

}


/* ============================================================
   FINISH ONBOARDING
   ============================================================ */

function finishOnboarding(){

  const profile={

    ...state.onboardingData,

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };


  write(
    STORAGE.profile,
    profile
  );


  const plan=
    generatePlan(
      profile
    );


  write(
    STORAGE.plan,
    plan
  );


  const progress=
    getProgress();


  if(
    !progress.weights ||
    progress.weights.length===0
  ){

    progress.weights=[

      {
        date:todayKey(),
        weight:Number(
          profile.weight
        )
      }

    ];

  }


  write(
    STORAGE.progress,
    progress
  );


  remove(
    STORAGE.onboarding
  );


  state.activePage="home";


  showLoadingScreen();

}

/* ============================================================
   NAVIGATION
   ============================================================ */

function navigate(page){

  if(
    state.currentWorkout
  ){

    return;

  }


  if(
    state.activePage===page
  ){

    return;

  }


  state.activePage=page;

  vibrate(8);


  renderPage();


  /*
    Only actual section navigation changes
    scroll position.
    Onboarding does NOT use this.
  */

  requestAnimationFrame(()=>{

    window.scrollTo(
      {
        top:0,
        left:0,
        behavior:"auto"
      }
    );

  });

}


/* ============================================================
   PAGE ROUTER
   ============================================================ */

function renderPage(){

  const container=
    document.getElementById(
      "pageContent"
    );


  if(!container)return;


  let html="";


  switch(
    state.activePage
  ){

    case "home":
      html=renderHome();
      break;

    case "workout":
      html=renderWorkoutPage();
      break;

    case "nutrition":
      html=renderNutritionPage();
      break;

    case "progress":
      html=renderProgressPage();
      break;

    case "profile":
      html=renderProfilePage();
      break;

    default:
      html=renderHome();

  }


  container.innerHTML=html;


  requestAnimationFrame(()=>{

    animateRings();

    animateNumbers();

  });

}

function getWorkoutStats(){

  const progress=
    getProgress();

  const sevenDays=
    Date.now()-
    (
      7*
      24*
      60*
      60*
      1000
    );


  const recent=
    (progress.workouts||[])
      .filter(
        workout=>
          workout.timestamp>=sevenDays
      );


  return{

    completed:
      recent.length,

    total:
      Number(
        getProfile()
          ?.trainingDays
      )||3

  };

}

   ============================================================ */

function startWorkout(name){

  const plan=
    getPlan();


  const workout=
    plan.workouts.find(
      item=>
        item.name===name
    );


  if(!workout){
    return;
  }


  state.currentWorkout=
    JSON.parse(
      JSON.stringify(workout)
    );


  state.timer=0;

  state.timerRunning=false;

   ------------------------------------------------------------

   ============================================================ */

function toggleExercise(index){

  const workout=
    state.currentWorkout;


  if(
    !workout ||
    !workout.exercises[index]
  ){

    return;

  }


  const exercise=
    workout.exercises[index];


  exercise.done=
    !exercise.done;


  const row=
    document.querySelector(
      `[data-exercise-index="${index}"]`
    );


  const button=
    document.querySelector(
      `[data-toggle-exercise="${index}"]`
    );


  if(row){

    row.classList.toggle(
      "done",
      exercise.done
    );

  }


  if(button){

    button.textContent=
      exercise.done
        ?"✓"
        :"";

  }


  updateSessionCounter();

  vibrate(8);

}

/* ============================================================
   TIMER
   ------------------------------------------------------------
   Timer only updates one DOM node.
   ============================================================ */

function startTimer(){

  if(state.timerRunning){
    return;
  }


  state.timerRunning=true;


  state.timerInterval=
    setInterval(
      ()=>{
        state.timer++;
        updateTimerDOM();
      },
      1000
    );


  updateTimerDOM();

}


function stopTimer(){

  state.timerRunning=false;


  if(
    state.timerInterval
  ){

    clearInterval(
      state.timerInterval
    );

    state.timerInterval=null;

  }


}


function toggleTimer(){

  if(
    state.timerRunning
  ){

    stopTimer();

  }else{

    startTimer();

  }


  updateTimerDOM();

}


function resetTimer(){

  state.timer=0;

  updateTimerDOM();

}


function updateTimerDOM(){

  const timer=
    document.getElementById(
      "timerValue"
    );


  if(timer){

    const minutes=
      Math.floor(
        state.timer/60
      );

    const seconds=
      state.timer%60;


    timer.textContent=
      String(minutes)
        .padStart(2,"0")
      +":"
      +String(seconds)
        .padStart(2,"0");

  }


  const button=
    document.getElementById(
      "timerToggle"
    );


  if(button){

    button.textContent=
      state.timerRunning
        ?"Ⅱ"
        :"▶";

  }

}


/* ============================================================
   COMPLETE WORKOUT
   ============================================================ */

function completeWorkout(){

  const workout=
    state.currentWorkout;


  if(!workout){
    return;
  }


  const done=
    workout.exercises
      .filter(
        item=>item.done
      )
      .length;


  if(done===0){

    toast(
      "Complete at least one exercise first."
    );

    return;

  }


  stopTimer();


  const progress=
    getProgress();


  progress.workouts=
    progress.workouts||[];


  progress.workouts.push({

    id:
      "w_"+Date.now(),

    date:
      todayKey(),

    timestamp:
      Date.now(),

    workoutName:
      workout.name,

    completedExercises:
      done,

    totalExercises:
      workout.exercises.length,

    durationSeconds:
      state.timer

  });


  updateStreak(
    progress
  );


  write(
    STORAGE.progress,
    progress
  );


  state.currentWorkout=null;


  showWorkoutComplete();

}


/* ============================================================
   STREAK
   ============================================================ */

function updateStreak(progress){

  const dates=
    [
      ...new Set(
        progress.workouts
          .map(
            item=>item.date
          )
      )
    ]
    .sort()
    .reverse();


  let streak=0;

  const cursor=
    new Date();


  for(
    const date
    of dates
  ){

    const key=
      cursor
        .toISOString()
        .slice(0,10);


    if(date===key){

      streak++;

      cursor.setDate(
        cursor.getDate()-1
      );

    }else if(date<key){

      break;

    }

  }


  progress.currentStreak=
    streak;


  progress.bestStreak=
    Math.max(
      progress.bestStreak||0,
      streak
    );

}

function toggleMeal(index){

  const meals=
    getMeals();


  meals[
    todayKey()

    meals[
      todayKey()
    ]||[];


  const existing=
    meals[
      todayKey()
    ].findIndex(
      item=>
        item.planIndex===index

  if(existing>=0){

    meals[
      todayKey()
    ].splice(
      existing,
      1
    );

      "Meal removed."

      getPlan()

    meals[
      todayKey()

      planIndex:index,

      name:meal.name,

      calories:
        meal.calories,

    });


    toast(
      "Meal logged."
    );

  write(
    STORAGE.meals,
    meals
  );


  renderPage();

}

/* ============================================================
   WEIGHT CHART
   ============================================================ */

function renderWeightChart(weights){

  if(
    !weights ||
    weights.length<2
  ){

    return`

      <div class="chart-empty">

        Log at least two weight entries
        to create a trend chart.

      </div>

    `;

  }


  const data=
    weights.slice(-12);


  const values=
    data.map(
      item=>
        Number(
          item.weight
        )
    );


  const min=
    Math.min(...values)-1;

  const max=
    Math.max(...values)+1;


  const width=500;

  const height=170;


  const points=
    data.map(
      (item,index)=>{

        const x=
          data.length===1

            ?width/2

            :(index/
              (data.length-1)
             )*
             width;


        const y=
          height-
          (
            (
              Number(
                item.weight
              )-
              min
            )/
            (
              max-min
            )
          )*
          130-
          20;


        return[
          x,
          y
        ];

      }
    );


  const line=
    points
      .map(
        point=>
          point.join(",")
      )
      .join(" ");


  return`

    <div class="chart">

      <svg
        viewBox="0 0 ${width} ${height}"
        preserveAspectRatio="none"
      >

        <polyline

   ============================================================ */

function logWeight(){

  const weightInput=
    document.getElementById(
      "weightLogInput"
    );

  const dateInput=
    document.getElementById(
      "weightLogDate"
    );


  if(
    !weightInput ||
    !dateInput
  ){

    return;

  }


  const weight=
    Number(
      weightInput.value
    );


  if(
    !Number.isFinite(weight) ||
    weight<25 ||
    weight>300
  ){

    toast(
      "Enter a valid weight."
    );

    return;

  }


  const progress=
    getProgress();


  progress.weights=
    progress.weights||[];


  progress.weights=
    progress.weights.filter(
      item=>
        item.date!==dateInput.value
    );


  progress.weights.push({

    date:
      dateInput.value,

    weight:
      round(
        weight,
        1
      )

  });


  progress.weights.sort(
    (a,b)=>
      new Date(a.date)-
      new Date(b.date)
  );


  write(
    STORAGE.progress,
    progress
  );


  toast(
    "Weight saved."
  );


  renderPage();

}

/* ============================================================
   MODAL
   ============================================================ */

function openModal(content){

  closeModal();


  const layer=
    document.createElement(
      "div"
    );


  layer.id="modalLayer";

  layer.className=
    "modal-layer";


  layer.innerHTML=`

    <div class="modal">

      ${content}

    </div>

  `;


  layer.addEventListener(
    "click",
    event=>{

      if(
        event.target===layer
      ){

        closeModal();

      }

    }
  );


  document.body.appendChild(
    layer
  );


  /*
    Event delegation inside modal.
    One listener instead of many unnecessary
    global listeners.
  */

  layer.addEventListener(
    "click",
    event=>{

      const close=
        event.target.closest(
          "[data-close-modal]"
        );


      if(close){

        closeModal();

      }


      const scale=
        event.target.closest(
          "[data-scale]"
        );


      if(scale){

        selectScale(
          scale.dataset.scale,
          Number(
            scale.dataset.scaleValue
          )
        );

      }

    }
  );

}


function closeModal(){

  const layer=
    document.getElementById(
      "modalLayer"
    );


  if(layer){

    layer.remove();

  }

}

/* ============================================================
   SEND CHAT
   ============================================================ */

function sendChat(event){

  event.preventDefault();


  const input=
    document.getElementById(
      "chatInput"
    );


  if(!input){
    return;
  }


  const text=
    input.value.trim();


  if(!text){
    return;
  }


  const history=
    getChatHistory();


  const userMessage={

    role:"user",

    text,

    timestamp:
      Date.now()

  };


  history.push(
    userMessage
  );


  saveChatHistory(
    history
  );


  const messages=
    document.getElementById(
      "chatMessages"
    );


  if(messages){

    messages.insertAdjacentHTML(
      "beforeend",
      renderMessage(
        userMessage
      )
    );


    messages.insertAdjacentHTML(
      "beforeend",
      `
        <div
          id="chatTyping"
          class="message bot"
        >

          <div class="typing">

            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>

          </div>

        </div>
      `
    );


    messages.scrollTop=
      messages.scrollHeight;

  }


  input.value="";


  setTimeout(()=>{

    const response=
      generateChatResponse(
        text
      );


    const typing=
      document.getElementById(
        "chatTyping"
      );


    if(typing){

      typing.remove();

    }


    const updated=
      getChatHistory();


    const botMessage={

      role:"bot",

      text:response,

      timestamp:
        Date.now()

    };


    updated.push(
      botMessage
    );


    saveChatHistory(
      updated
    );


    const box=
      document.getElementById(
        "chatMessages"
      );


    if(box){

      box.insertAdjacentHTML(
        "beforeend",
        renderMessage(
          botMessage
        )
      );


      box.scrollTop=
        box.scrollHeight;

    }

  },380);

}
